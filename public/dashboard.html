<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Granskning Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --bg2: #161616; --card: #1c1c1c; --border: #2a2a2a; --border2: #383838;
      --text: #f2f2f2; --muted: #555; --muted2: #888; --muted3: #aaa;
      --yellow: #d4f044; --yellow-dim: rgba(212,240,68,0.1);
      --green: #22c55e; --green-dim: rgba(34,197,94,0.1);
      --red: #f04040; --red-dim: rgba(240,64,64,0.1);
      --amber: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6;
      --radius: 14px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* TOPBAR */
    .topbar {
      background:var(--bg2); border-bottom:1px solid var(--border);
      padding:0 28px; height:52px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:50;
    }
    .logo { font-size:12px; font-weight:700; color:var(--muted2); letter-spacing:1px; text-transform:uppercase; }
    .topbar-center { display:flex; align-items:center; gap:10px; }
    .company-tag { font-size:14px; font-weight:700; }
    .tag-pill {
      font-size:11px; padding:3px 10px; border-radius:20px;
      border:1px solid var(--border2); color:var(--muted3); background:var(--bg);
    }
    .tag-pill.yellow { color:var(--yellow); background:var(--yellow-dim); border-color:rgba(212,240,68,0.25); }
    .tag-pill.green { color:var(--green); background:var(--green-dim); border-color:rgba(34,197,94,0.25); }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* LAYOUT */
    .container { max-width:1180px; margin:0 auto; padding:28px 24px; }

    /* COMPANY HEADER */
    .co-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      padding-bottom:24px; border-bottom:1px solid var(--border); margin-bottom:28px; gap:20px;
    }
    .co-left { display:flex; align-items:center; gap:18px; }
    .co-logo {
      width:52px; height:52px; border-radius:12px;
      background:linear-gradient(135deg,#2a2a2a,#1a1a1a);
      border:1px solid var(--border2);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:800; color:var(--muted3); flex-shrink:0;
    }
    .co-name { font-size:20px; font-weight:800; letter-spacing:-.5px; margin-bottom:5px; }
    .co-sub { font-size:13px; color:var(--muted2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .co-right { text-align:right; flex-shrink:0; }
    .progress-label { font-size:11px; color:var(--muted); margin-bottom:5px; }
    .progress-pct { font-size:24px; font-weight:800; letter-spacing:-1px; }
    .progress-bar { width:160px; height:3px; background:var(--border2); border-radius:3px; margin:6px 0 5px auto; overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px; background:var(--yellow); }
    .progress-sub { font-size:11px; color:var(--muted); }

    /* KPI GRID */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
    @media(max-width:800px) { .kpi-grid { grid-template-columns:1fr 1fr; } }
    .kpi-card { background:var(--card); padding:20px 22px 16px; cursor:pointer; transition:background .15s; }
    .kpi-card:hover { background:#222; }
    .kpi-label { font-size:11px; color:var(--muted2); margin-bottom:8px; display:flex; align-items:center; gap:5px; }
    .kpi-label svg { width:12px; height:12px; }
    .kpi-value { font-size:30px; font-weight:800; letter-spacing:-1.5px; line-height:1; margin-bottom:12px; }
    .kpi-sparkline { height:40px; margin-bottom:10px; }
    .kpi-sparkline svg { width:100%; height:100%; overflow:visible; }
    .kpi-trend { font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
    .kpi-trend.pos { color:var(--yellow); }
    .kpi-trend.neg { color:var(--red); }
    .kpi-trend.neu { color:var(--muted2); }

    /* MAIN CHART */
    .chart-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
    .chart-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px; }
    .chart-title { font-size:16px; font-weight:700; }
    .chart-subtitle { font-size:12px; color:var(--muted2); margin-top:3px; }
    .chart-meta { font-size:11px; color:var(--muted); text-align:right; }
    .chart-wrap { height:220px; position:relative; margin-top:20px; }
    .chart-wrap svg { width:100%; height:100%; overflow:visible; }
    .annotation-bubble {
      display:inline-flex; align-items:center; gap:5px;
      font-size:11px; font-weight:700; color:#0f0f0f;
      background:var(--yellow); border-radius:20px;
      padding:3px 10px; white-space:nowrap;
    }
    .annotation-bubble.red { background:var(--red); color:#fff; }
    .annotation-bubble.green { background:var(--green); color:#0f0f0f; }
    .chart-axis { display:flex; justify-content:space-between; margin-top:8px; padding:0 4px; }
    .chart-axis span { font-size:11px; color:var(--muted); }
    .chart-footnote { font-size:11px; color:var(--muted); margin-top:12px; display:flex; align-items:center; gap:6px; }

    /* SECTION HEADER */
    .section-row { display:flex; align-items:center; justify-content:space-between; margin:28px 0 14px; }
    .section-label { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.7px; text-transform:uppercase; }

    /* DETAIL GRID */
    .detail-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:20px; }
    @media(max-width:900px) { .detail-grid { grid-template-columns:1fr 1fr; } }
    @media(max-width:580px) { .detail-grid { grid-template-columns:1fr; } }
    .detail-grid.two { grid-template-columns:1fr 1fr; }

    /* CARD */
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .card-title { font-size:11px; font-weight:700; color:var(--muted2); letter-spacing:.5px; text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; }
    .card-badge { font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--border); color:var(--muted2); text-transform:none; letter-spacing:0; }

    /* BIG STAT */
    .big-stat { font-size:36px; font-weight:800; letter-spacing:-1.5px; line-height:1; margin-bottom:4px; }
    .stat-sub { font-size:12px; color:var(--muted2); margin-bottom:14px; }
    .sep { height:1px; background:var(--border); margin:14px 0; }

    /* BARS */
    .hbar-list { display:flex; flex-direction:column; gap:9px; }
    .hbar-row { display:flex; align-items:center; gap:10px; }
    .hbar-label { font-size:11px; color:var(--muted2); width:90px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hbar-track { flex:1; background:var(--border); border-radius:4px; height:5px; overflow:hidden; }
    .hbar-fill { height:100%; border-radius:4px; background:var(--border2); transition:width .4s; }
    .hbar-fill.blue { background:var(--blue); }
    .hbar-fill.yellow { background:var(--yellow); }
    .hbar-fill.red { background:var(--red); }
    .hbar-num { font-size:11px; font-weight:700; color:var(--muted3); width:22px; text-align:right; }

    /* FUNNEL */
    .funnel { display:flex; flex-direction:column; gap:7px; }
    .funnel-row { display:flex; align-items:center; gap:10px; }
    .funnel-label { font-size:11px; color:var(--muted2); width:95px; flex-shrink:0; }
    .funnel-track { flex:1; background:var(--border); border-radius:4px; height:6px; overflow:hidden; }
    .funnel-bar { height:100%; border-radius:4px; background:#383838; transition:width .5s; }
    .funnel-n { font-size:11px; font-weight:700; color:var(--muted3); width:26px; text-align:right; }
    .funnel-drop { font-size:10px; color:var(--red); font-weight:700; }

    /* HEALTH RING */
    .health-wrap { display:flex; align-items:center; gap:18px; }
    .health-ring { position:relative; width:88px; height:88px; flex-shrink:0; }
    .health-ring svg { transform:rotate(-90deg); }
    .health-ring circle { fill:none; stroke-width:7; }
    .health-ring .track { stroke:var(--border2); }
    .health-ring .fill { stroke-dasharray:283; stroke-linecap:round; transition:stroke-dashoffset .8s; }
    .health-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:20px; font-weight:800; }
    .health-info .label { font-size:15px; font-weight:700; margin-bottom:4px; }
    .health-items { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
    .health-item { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted2); }
    .hdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

    /* AI TOOLS */
    .ai-tools-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ai-tool-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:10px;
      padding:16px; cursor:pointer; transition:border-color .15s;
    }
    .ai-tool-card:hover { border-color:var(--border2); }
    .ai-tool-icon { font-size:22px; margin-bottom:8px; }
    .ai-tool-name { font-size:13px; font-weight:700; margin-bottom:4px; }
    .ai-tool-desc { font-size:11px; color:var(--muted2); line-height:1.5; }
    .ai-tool-tag {
      display:inline-block; margin-top:8px; font-size:10px; font-weight:700;
      color:var(--yellow); background:var(--yellow-dim);
      border:1px solid rgba(212,240,68,.2); border-radius:20px; padding:2px 8px;
    }
    .ai-tool-tag.soon { color:var(--muted); background:transparent; border-color:var(--border); }

    /* NOSHOW COST */
    .cost-highlight {
      background:var(--red-dim); border:1px solid rgba(240,64,64,.2);
      border-radius:8px; padding:12px 14px; margin-top:14px; font-size:12px; color:var(--muted3); line-height:1.6;
    }
    .cost-highlight strong { color:var(--red); font-size:16px; }

    /* INSIGHTS */
    .insight-list { display:flex; flex-direction:column; gap:10px; }
    .insight-item { padding:14px 16px; border-radius:10px; background:var(--bg2); border:1px solid var(--border); font-size:13px; line-height:1.5; }
    .insight-item.high { border-left:3px solid var(--red); }
    .insight-item.medium { border-left:3px solid var(--amber); }
    .insight-item.low { border-left:3px solid var(--green); }
    .insight-title { font-weight:700; margin-bottom:3px; font-size:12px; }
    .insight-desc { font-size:12px; color:var(--muted2); }

    /* CONNECT HINT */
    .connect-hint { margin-top:14px; font-size:12px; color:var(--muted); background:var(--bg2); border-radius:8px; padding:12px 14px; border:1px solid var(--border); line-height:1.5; }

    /* REPORT */
    .report-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--text); color:var(--bg); border:none;
      border-radius:8px; padding:11px 22px; font-size:13px; font-weight:700;
      font-family:'Inter',sans-serif; cursor:pointer; text-decoration:none; transition:opacity .15s;
    }
    .report-btn:hover { opacity:.85; }

    /* PENDING STATES */
    .setup-pending { max-width:420px; margin:100px auto; text-align:center; padding:0 20px; }
    .setup-icon { font-size:48px; margin-bottom:20px; }
    .setup-title { font-size:22px; font-weight:800; margin-bottom:10px; letter-spacing:-.5px; }
    .setup-sub { font-size:14px; color:var(--muted2); line-height:1.6; }

    /* ANALYZING */
    .analyzing-wrap { max-width:480px; margin:80px auto; padding:0 20px; }
    .analyzing-wrap h2 { font-size:26px; font-weight:800; letter-spacing:-1px; margin-bottom:10px; }
    .analyzing-wrap p { font-size:14px; color:var(--muted2); line-height:1.6; margin-bottom:32px; }
    .a-step { display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
    .a-step:last-child { border-bottom:none; }
    .a-dot { width:11px; height:11px; border-radius:50%; border:2px solid var(--border2); flex-shrink:0; margin-top:3px; transition:all .3s; }
    .a-dot.active { border-color:var(--yellow); background:var(--yellow); box-shadow:0 0 10px rgba(212,240,68,.4); animation:blink 1.5s infinite; }
    .a-dot.done { border-color:var(--green); background:var(--green); animation:none; }
    .a-step-text { font-size:14px; color:var(--muted); transition:color .3s; }
    .a-step-text.active { color:var(--text); font-weight:600; }

    /* WELCOME ANALYSIS */
    .plan-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    @media(max-width:700px) { .plan-cards { grid-template-columns:1fr; } }
    .plan-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
    .plan-day { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; margin-bottom:7px; }
    .plan-focus { font-size:14px; font-weight:700; margin-bottom:5px; }
    .plan-why { font-size:12px; color:var(--muted2); margin-bottom:10px; line-height:1.5; }
    .plan-check { font-size:11px; color:var(--muted); display:flex; gap:6px; margin-bottom:3px; }
    .plan-check::before { content:'→'; color:var(--purple); flex-shrink:0; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:5px; }
  </style>
</head>
<body>

<div class="topbar" id="topbar">
  <span class="logo">AI-Granskning</span>
  <div class="topbar-center" id="topbarCenter"></div>
  <div style="display:flex;align-items:center;gap:7px">
    <span class="live-dot"></span>
    <span style="font-size:11px;color:var(--muted)">Live</span>
  </div>
</div>

<div id="root" style="min-height:80vh"></div>

<script>
const token = location.pathname.split('/')[2];
let _data = null;

async function load() {
  if (!token) { showError('Åtkomst saknas','Öppna länken du fick från din konsult.','🔑'); return; }
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (!r.ok) throw new Error();
    _data = await r.json();
    render(_data);
  } catch(e) { showError('Ogiltig länk','Kontakta din konsult för en ny länk.','🔒'); }
}

function showError(title, sub, icon) {
  document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">${icon}</div><div class="setup-title">${title}</div><div class="setup-sub">${sub}</div></div>`;
}

setInterval(async () => {
  if (!token) return;
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (r.ok) { _data = await r.json(); render(_data); }
  } catch(e) {}
}, 30000);

function render(data) {
  const { audit, kpis, funnel, dropoffStep, bookingsPerDay, emailCategories, manualTime, healthScore, insights } = data;
  const modules = audit.aiModules || [];

  const initials = (audit.companyName||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('topbarCenter').innerHTML = `
    <span class="company-tag">${audit.companyName}</span>
    <span class="tag-pill">${audit.industry||'Företag'}</span>
    <span class="tag-pill yellow">Dag ${audit.dayNumber} / 7</span>`;

  if (!audit.setupComplete || !modules.length) {
    if (audit.welcomeComplete && audit.aiWelcomeAnalysis) {
      document.getElementById('root').innerHTML = renderWelcomeAnalysis(audit);
    } else if (audit.welcomeComplete) {
      document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">🔍</div><div class="setup-title">AI:n analyserar er situation</div><div class="setup-sub">Era svar är mottagna. Sidan uppdateras automatiskt.</div></div>`;
      let n=0; const pi=setInterval(async()=>{
        if(++n>30){clearInterval(pi);return;}
        try{const r=await fetch('/api/dashboard',{headers:{'x-audit-token':token}});
        if(!r.ok)return; const f=await r.json();
        if(f.audit?.aiWelcomeAnalysis){clearInterval(pi);setTimeout(()=>location.reload(),400);}}catch(e){}
      },4000);
    } else {
      document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">⚙️</div><div class="setup-title">Dashboard konfigureras</div><div class="setup-sub">Din personliga AI-dashboard håller på att byggas upp.</div></div>`;
    }
    return;
  }

  const dayPct = Math.round((audit.dayNumber/7)*100);
  let html = `<div class="container">`;

  // ── COMPANY HEADER
  html += `<div class="co-header">
    <div class="co-left">
      <div class="co-logo">${initials}</div>
      <div>
        <div class="co-name">${audit.companyName}</div>
        <div class="co-sub">
          <span>${audit.industry||'Företag'}</span>
          <span style="color:var(--border2)">·</span>
          <span class="tag-pill green" style="font-size:11px">● Aktiv granskning</span>
        </div>
      </div>
    </div>
    <div class="co-right">
      <div class="progress-label">Granskningsframsteg</div>
      <div class="progress-pct">${dayPct}%</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${dayPct}%"></div></div>
      <div class="progress-sub">${audit.daysLeft>0?`${audit.daysLeft} dagar kvar`:'Avslutad'}</div>
    </div>
  </div>`;

  // ── KPI GRID
  html += renderKpiGrid(kpis, modules, bookingsPerDay, manualTime);

  // ── MAIN CHART
  html += renderMainChart(bookingsPerDay, audit);

  // ── AI TOOLS (anpassade efter analys)
  if (audit.aiWelcomeAnalysis) {
    html += `<div class="section-row"><span class="section-label">AI-verktyg för er</span><span style="font-size:11px;color:var(--muted)">Baserat på er granskning</span></div>`;
    html += renderAiTools(audit.aiWelcomeAnalysis, audit.industry);
  }

  // ── DETAIL GRID
  const detailCards = [];
  if (modules.includes('bookings')||modules.includes('noshow')) detailCards.push(renderNoShowCard(kpis, bookingsPerDay));
  if (modules.includes('email')) detailCards.push(renderEmailCard(emailCategories));
  if (modules.includes('funnel')) detailCards.push(renderFunnelCard(funnel, dropoffStep));
  if (modules.includes('manual_time')) detailCards.push(renderTimeCard(manualTime));
  if (modules.includes('invoicing')) detailCards.push(renderInvoiceCard());
  if (modules.includes('social')) detailCards.push(renderSocialCard());
  if (modules.includes('visitors')) detailCards.push(renderVisitorsCard(kpis));
  detailCards.push(renderHealthCard(healthScore, kpis));

  if (detailCards.length) {
    html += `<div class="section-row"><span class="section-label">Detaljerad analys</span></div>`;
    html += `<div class="detail-grid">${detailCards.join('')}</div>`;
  }

  // ── INSIGHTS
  if (insights && insights.length) {
    html += `<div class="section-row"><span class="section-label">AI-insikter</span></div>`;
    html += `<div class="insight-list">${insights.map(i=>`<div class="insight-item ${i.priority||'medium'}"><div class="insight-title">${i.title||''}</div><div class="insight-desc">${i.description||''}</div></div>`).join('')}</div>`;
  }

  // ── REPORT
  html += `<div class="section-row" style="margin-top:32px"><span class="section-label">Slutrapport</span></div>
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <div style="font-weight:700;font-size:15px;margin-bottom:4px">AI-genererad analysrapport</div>
      <div style="font-size:13px;color:var(--muted2)">${audit.daysLeft>0?`Rapporten genereras dag 7 – om ${audit.daysLeft} dag${audit.daysLeft!==1?'ar':''}. `:'Granskningen är klar.'}</div>
    </div>
    <a href="/dashboard/${token}/report" class="report-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      ${audit.daysLeft>0?'Förhandsgranska':'Öppna rapport'}
    </a>
  </div>
  <div style="height:48px"></div></div>`;

  document.getElementById('root').innerHTML = html;
}

// ══════════════════════════════════════
// KPI GRID – med sparkline-kurvor
// ══════════════════════════════════════
function renderKpiGrid(kpis, modules, bookingsPerDay, manualTime) {
  function sparkSvg(vals, color, fill) {
    if (!vals||vals.length<2) return '';
    const max=Math.max(...vals,1), min=Math.min(...vals,0), range=max-min||1;
    const W=100,H=40;
    const pts=vals.map((v,i)=>{
      const x=(i/(vals.length-1))*W;
      const y=H-((v-min)/range)*(H-6)-3;
      return [x,y];
    });
    const line=pts.map((p,i)=>(i===0?`M${p[0].toFixed(1)} ${p[1].toFixed(1)}`:`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`)).join(' ');
    const area=`${line} L${W} ${H} L0 ${H} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="g${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="${fill||'none'}" opacity=".6"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  // Generate realistic-looking wavy sparkline values
  function wave(base, n=7, variance=0.2) {
    const r=[];
    for(let i=0;i<n;i++) r.push(Math.max(0, base*(1 + (Math.random()-.5)*variance)));
    r[n-1]=base; return r;
  }

  const cards=[];

  if (modules.includes('visitors')||modules.includes('funnel')) {
    const v=kpis.visitors||0;
    const vals=wave(v);
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">Webbbesökare</div>
      <div class="kpi-value">${v}</div>
      <div class="kpi-sparkline">${sparkSvg(vals,'#3b82f6','rgba(59,130,246,0.1)')}</div>
      <div class="kpi-trend neu">senaste 7 dagarna</div>
    </div>`);
  }

  if (modules.includes('bookings')||modules.includes('noshow')) {
    const rate=kpis.noShowRate||0;
    const isHigh=rate>10;
    const vals=wave(rate,7,0.3);
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">No-show-rate</div>
      <div class="kpi-value" style="color:${isHigh?'var(--red)':'var(--green)'}">${rate}<span style="font-size:14px;font-weight:400;color:var(--muted2)">%</span></div>
      <div class="kpi-sparkline">${sparkSvg(vals,isHigh?'#f04040':'#22c55e',isHigh?'rgba(240,64,64,0.1)':'rgba(34,197,94,0.1)')}</div>
      <div class="kpi-trend ${isHigh?'neg':'pos'}">${isHigh?'⚠ Åtgärd behövs':'✓ OK nivå'}</div>
    </div>`);
  }

  if (modules.includes('email')) {
    const em=kpis.unansweredEmails||0;
    const isHigh=em>5;
    const vals=wave(em,7,0.4);
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">Obesvarade mejl</div>
      <div class="kpi-value" style="color:${isHigh?'var(--amber)':'var(--text)'}">${em}</div>
      <div class="kpi-sparkline">${sparkSvg(vals,isHigh?'#f59e0b':'#888','rgba(245,158,11,0.1)')}</div>
      <div class="kpi-trend ${isHigh?'neg':'neu'}">${isHigh?'Kräver svar':'Under kontroll'}</div>
    </div>`);
  }

  if (modules.includes('funnel')) {
    const cr=kpis.conversionRate||0;
    const vals=wave(cr,7,0.25);
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">Konvertering</div>
      <div class="kpi-value">${cr}<span style="font-size:14px;font-weight:400;color:var(--muted2)">%</span></div>
      <div class="kpi-sparkline">${sparkSvg(vals,'#d4f044','rgba(212,240,68,0.1)')}</div>
      <div class="kpi-trend neu">besök → bokning</div>
    </div>`);
  }

  if (modules.includes('manual_time')) {
    const h=manualTime?.total||0;
    const vals=wave(h,7,0.15);
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">Manuell tid</div>
      <div class="kpi-value">${h}<span style="font-size:14px;font-weight:400;color:var(--muted2)">h/v</span></div>
      <div class="kpi-sparkline">${sparkSvg(vals,'#8b5cf6','rgba(139,92,246,0.1)')}</div>
      <div class="kpi-trend neg">kan automatiseras</div>
    </div>`);
  }

  if (!cards.length) {
    const hs=0;
    cards.push(`<div class="kpi-card"><div class="kpi-label">Hälsostatus</div><div class="kpi-value">${hs}<span style="font-size:14px;color:var(--muted2)">/100</span></div><div class="kpi-trend neu">Totalt betyg</div></div>`);
  }

  return `<div class="kpi-grid">${cards.slice(0,4).join('')}</div>`;
}

// ══════════════════════════════════════
// MAIN AREA CHART – granskningsframsteg dag 1–7
// ══════════════════════════════════════
function renderMainChart(bookingsPerDay, audit) {
  const perDay = bookingsPerDay || [];
  const dayNum = audit.dayNumber || 1;

  // Bygg dag 1–7 data: bokningar per granskningsdag
  // Om bookingsPerDay finns använder vi det, annars visar vi bara dag-struktur
  const dayLabels = ['Dag 1','Dag 2','Dag 3','Dag 4','Dag 5','Dag 6','Dag 7'];

  // Hämta bokningar per dag (index 0–6 = dag 1–7)
  let counts;
  if (perDay.length >= 2) {
    // Använd riktig data, fyll ut till 7 dagar
    counts = Array.from({length:7}, (_,i) => perDay[i] ? perDay[i].count : null);
  } else {
    // Ingen bokningsdata – visa tomt diagram (linjen ritas bara för klara dagar)
    counts = Array.from({length:7}, () => null);
  }

  // Markera bara dagar som faktiskt passerat
  const knownCounts = counts.slice(0, dayNum).map(v => v !== null ? v : 0);

  const W=700, H=180, padL=36, padR=20, padT=28, padB=8;
  const iW=W-padL-padR, iH=H-padT-padB;
  const max = Math.max(...knownCounts, 1);
  const uid = Math.random().toString(36).slice(2);

  function xOf(i, total) { return padL + (i / (total-1)) * iW; }
  function yOf(v) { return padT + iH - (v / max) * iH * 0.88; }

  // Punkter för klara dagar
  const pts = knownCounts.map((v,i) => [xOf(i, 7), yOf(v)]);

  function bezier(pts) {
    if (pts.length < 2) return pts.length===1 ? `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}` : '';
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i=1;i<pts.length;i++) {
      const cx = pts[i-1][0] + (pts[i][0]-pts[i-1][0])*0.45;
      d += ` C ${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)}, ${cx.toFixed(1)} ${pts[i][1].toFixed(1)}, ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
    }
    return d;
  }

  const linePath = pts.length >= 2 ? bezier(pts) : '';
  const bottom = padT + iH;
  const areaPath = linePath ? `${linePath} L${pts[pts.length-1][0].toFixed(1)} ${bottom} L${pts[0][0].toFixed(1)} ${bottom} Z` : '';

  // Gridlinjer (horisontella)
  const gridVals = [0.25, 0.5, 0.75, 1.0];
  const gridLines = gridVals.map(f => {
    const y = yOf(f * max);
    const label = Math.round(f * max);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#222" stroke-width="1"/>
      <text x="${(padL-7).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#444" font-size="10" font-family="Inter,sans-serif">${label}</text>`;
  }).join('');

  // Vertikala dagmarkeringar
  const dayLines = dayLabels.map((_,i) => {
    const x = xOf(i, 7);
    return `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${bottom}" stroke="#1e1e1e" stroke-width="1"/>`;
  }).join('');

  // Datapunkter – prickar + tooltip-label vid aktiv dag
  let dots = '';
  pts.forEach((p, i) => {
    const isToday = i === dayNum - 1;
    const v = knownCounts[i];
    if (isToday) {
      // Stor glödande prick för dagens dag
      dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="rgba(212,240,68,0.15)" stroke="#d4f044" stroke-width="1.5"/>
        <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#d4f044"/>`;
      // Annotation ovanför
      const lx = Math.min(Math.max(p[0], padL+40), W-padR-40);
      dots += `<rect x="${(lx-36).toFixed(1)}" y="${(p[1]-34).toFixed(1)}" width="72" height="22" rx="5" fill="#d4f044"/>
        <text x="${lx.toFixed(1)}" y="${(p[1]-18).toFixed(1)}" text-anchor="middle" fill="#0f0f0f" font-size="11" font-weight="700" font-family="Inter,sans-serif">Dag ${dayNum} · idag</text>`;
    } else {
      dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#d4f044" opacity="0.7"/>`;
    }
  });

  // Väntande dagar (grå prickar)
  for (let i = dayNum; i < 7; i++) {
    const x = xOf(i, 7);
    const y = padT + iH * 0.5; // mittenlinje
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>`;
  }

  // Dag-etiketter på X-axeln
  const xLabels = dayLabels.map((lbl, i) => {
    const x = xOf(i, 7);
    const isToday = i === dayNum - 1;
    const isPast = i < dayNum - 1;
    const color = isToday ? '#d4f044' : isPast ? '#666' : '#333';
    const weight = isToday ? '700' : '400';
    return `<text x="${x.toFixed(1)}" y="${(H+2).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="10" font-weight="${weight}" font-family="Inter,sans-serif">${lbl}</text>`;
  }).join('');

  // Stat i headern – verklig total om data finns
  const totalBookings = knownCounts.reduce((a,b)=>a+b,0);
  const hasData = perDay.length >= 2;

  // Milstolpar (dag 1, dag 4, dag 7)
  const milestones = [
    { day: 0, label: 'Start' },
    { day: 3, label: 'Halvtid' },
    { day: 6, label: 'Rapport' },
  ];
  const milestoneMarks = milestones.map(m => {
    const x = xOf(m.day, 7);
    const done = m.day < dayNum;
    const color = done ? '#3b82f6' : '#2a2a2a';
    return `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT-10).toFixed(1)}" stroke="${color}" stroke-width="1.5"/>
      <text x="${x.toFixed(1)}" y="${(padT-14).toFixed(1)}" text-anchor="middle" fill="${done?'#3b82f6':'#333'}" font-size="9" font-family="Inter,sans-serif">${m.label}</text>`;
  }).join('');

  return `<div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">${hasData ? 'Bokningsaktivitet' : 'Granskningsframsteg'}</div>
        <div class="chart-subtitle">Dag 1–7 · ${audit.companyName}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        ${hasData ? `<div style="text-align:right">
          <div style="font-size:22px;font-weight:800;letter-spacing:-1px;color:var(--yellow);line-height:1">${totalBookings}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:1px">bokningar hittills</div>
        </div>` : ''}
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1">${dayNum}<span style="font-size:13px;font-weight:400;color:var(--muted)">/7</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:1px">dagar klara</div>
        </div>
      </div>
    </div>
    <div class="chart-wrap" style="height:200px">
      <svg viewBox="0 0 ${W} ${H+14}" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
        <defs>
          <linearGradient id="ag${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d4f044" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#d4f044" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridLines}
        ${dayLines}
        ${milestoneMarks}
        ${areaPath ? `<path d="${areaPath}" fill="url(#ag${uid})"/>` : ''}
        ${linePath ? `<path d="${linePath}" fill="none" stroke="#d4f044" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
        ${dots}
        ${xLabels}
      </svg>
    </div>
    <div class="chart-footnote">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${hasData ? 'Automatiskt insamlad data' : 'Uppdateras varje dag under granskningen'} · granskningsperiod dag 1–7
    </div>
  </div>`;
}

// AI TOOLS – anpassade efter analys
// ══════════════════════════════════════
function renderAiTools(analysis, industry) {
  // Generera relevanta verktyg baserat på analysen
  const rec = (analysis.ai_recommendation||'').toLowerCase();
  const problem = (analysis.real_problem||'').toLowerCase();
  const causes = (analysis.likely_root_causes||[]).join(' ').toLowerCase();
  const all = rec + ' ' + problem + ' ' + causes;

  const tools = [];

  // Alltid relevant
  tools.push({
    icon:'🤖',
    name:'AI-receptionist',
    desc:'Svarar automatiskt på vanliga frågor via mejl och chatt, dygnet runt.',
    tag:'Rekommenderat',
    hot:true
  });

  if (all.includes('bokning')||all.includes('no-show')||all.includes('påminn')) {
    tools.push({ icon:'📅', name:'Bokningspåminnelse', desc:'Skickar automatiska SMS/mejl-påminnelser 24h och 2h innan bokad tid.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('recension')||all.includes('google')||all.includes('betyg')||all.includes('review')) {
    tools.push({ icon:'⭐', name:'Recensionsbot', desc:'Följer automatiskt upp nöjda kunder med en länk till Google Reviews.', tag:'Hög prioritet', hot:true });
  }
  if (all.includes('återkommande')||all.includes('lojalitet')||all.includes('uppföljning')) {
    tools.push({ icon:'💌', name:'Kunduppföljning', desc:'Kontaktar automatiskt kunder som inte bokat på 30+ dagar med ett erbjudande.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('mejl')||all.includes('e-post')||all.includes('svar')) {
    tools.push({ icon:'✉️', name:'Mejl-AI', desc:'Sorterar, prioriterar och svarar på vanliga mejl automatiskt.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('faktura')||all.includes('betalning')) {
    tools.push({ icon:'🧾', name:'Faktura-automation', desc:'Skickar påminnelser för obetalda fakturor och skapar fakturor automatiskt.', tag:'Kan spara tid', hot:false });
  }
  if (all.includes('social')||all.includes('instagram')||all.includes('facebook')) {
    tools.push({ icon:'📱', name:'Social media-AI', desc:'Genererar och schemalägger inlägg för Instagram och Facebook automatiskt.', tag:'Kan spara tid', hot:false });
  }

  // Alltid med som "kommer snart"
  tools.push({ icon:'📊', name:'Rapport-AI', desc:'Veckovis AI-genererad rapport om er verksamhet med konkreta åtgärder.', tag:'Kommer snart', soon:true });
  tools.push({ icon:'🔍', name:'Konkurrentanalys', desc:'Bevakar era konkurrenters recensioner, priser och sociala medier.', tag:'Kommer snart', soon:true });

  const shown = tools.slice(0,8);

  return `<div class="ai-tools-grid">
    ${shown.map(t=>`<div class="ai-tool-card">
      <div class="ai-tool-icon">${t.icon}</div>
      <div class="ai-tool-name">${t.name}</div>
      <div class="ai-tool-desc">${t.desc}</div>
      <span class="ai-tool-tag${t.soon?' soon':''}">${t.tag}</span>
    </div>`).join('')}
  </div>`;
}

function renderFunnelCard(funnel, dropoffStep) {
  const f=funnel||[];

        return `<div class="funnel-row">
          <span class="funnel-label" style="${isD?'color:var(--red);font-weight:700':''}">${s.step}</span>
          <div class="funnel-track"><div class="funnel-bar" style="width:${Math.round(s.count/maxV*100)}%;${isD?'background:var(--red)':''}"></div></div>
          <span class="funnel-n">${s.count}</span>
          ${i>0&&drop>20?`<span class="funnel-drop">−${drop}%</span>`:'<span style="width:36px"></span>'}

}

      ${kpis.conversionRate>0?`Konvertering: <strong style="color:var(--text)">${kpis.conversionRate}%</strong>`:'Konverteringsdata samlas in…'}
    </div>
  </div>`;
}

function renderHealthCard(hs, kpis) {
  const score=hs?.score||0;
  const offset=283-(score/100)*283;
  const color=score>=70?'#22c55e':score>=40?'#f59e0b':'#f04040';
  const label=score>=70?'God status':score>=40?'Förbättringsbar':'Kritisk';
  return `<div class="card">
    <div class="card-title">Hälsostatus</div>
    <div class="health-wrap">
      <div class="health-ring">
        <svg width="88" height="88" viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="45"/>
          <circle class="fill" cx="50" cy="50" r="45" style="stroke:${color};stroke-dashoffset:${offset}"/>
        </svg>
        <span class="health-num" style="color:${color}">${score}</span>
      </div>
      <div class="health-info">
        <div class="label" style="color:${color}">${label}</div>
        <div style="font-size:11px;color:var(--muted)">av 100 möjliga</div>
        <div class="health-items">
          <div class="health-item"><div class="hdot" style="background:${(kpis?.unansweredEmails||0)>5?'var(--amber)':'var(--green)'}"></div>E-post</div>
          <div class="health-item"><div class="hdot" style="background:${(kpis?.noShowRate||0)>10?'var(--red)':'var(--green)'}"></div>Bokningar</div>
          <div class="health-item"><div class="hdot" style="background:${(kpis?.conversionRate||0)>2?'var(--green)':'var(--amber)'}"></div>Konvertering</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════
// WELCOME ANALYSIS VIEW
// ══════════════════════════════════════
function renderWelcomeAnalysis(audit) {
  const a = audit.aiWelcomeAnalysis;
  const auditPlan = a.audit_plan || [];
  const rootCauses = a.likely_root_causes || [];
  const initials = (audit.companyName||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const dayPct = Math.round((audit.dayNumber/7)*100);

  // Statusikon för granskningssteg
  function stepStatus(idx) {
    if (idx < audit.dayNumber - 1) return { icon:'✓', color:'var(--green)', label:'Klar' };
    if (idx === audit.dayNumber - 1) return { icon:'●', color:'var(--yellow)', label:'Pågår nu' };
    return { icon:'○', color:'var(--muted)', label:'Väntar' };
  }

  // Rotorsakskort – visar vad som KOMMER att mätas
  function causeCard(cause, i) {
    const icons = ['🔍','⚡','📉','🔄','💬','⚠️'];
    return `<div style="display:flex;align-items:flex-start;gap:14px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px">
      <div style="font-size:18px;flex-shrink:0;margin-top:1px">${icons[i%icons.length]}</div>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px">${cause}</div>
        <div style="font-size:11px;color:var(--muted)">Granskas dag ${i<2?'1–2':i<4?'3–4':'5–7'}</div>
      </div>
    </div>`;
  }

  return `<div class="container">

    <!-- HEADER -->
    <div class="co-header">
      <div class="co-left">
        <div class="co-logo">${initials}</div>
        <div>
          <div class="co-name">${audit.companyName}</div>
          <div class="co-sub">
            <span>${audit.industry||'Företag'}</span>
            <span style="color:var(--border2)">·</span>
            <span class="tag-pill green" style="font-size:11px">● Granskning pågår</span>
          </div>
        </div>
      </div>
      <div class="co-right">
        <div class="progress-label">Granskningsframsteg</div>
        <div class="progress-pct">${dayPct}%</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${dayPct}%"></div></div>
        <div class="progress-sub">${audit.daysLeft > 0 ? `${audit.daysLeft} dagar kvar` : 'Avslutad'}</div>
      </div>
    </div>

    <!-- GRANSKNINGSSTATUS – tidslinje med dag-statusar -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-title">Granskningsstatus<span class="card-badge">Dag ${audit.dayNumber} av 7</span></div>
      <div style="display:flex;align-items:center;gap:0;margin-top:4px">
        ${Array.from({length:7},(_,i)=>{
          const st = stepStatus(i);
          const isLast = i===6;
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative">
            <div style="width:28px;height:28px;border-radius:50%;background:${i<audit.dayNumber-1?'var(--green)':i===audit.dayNumber-1?'rgba(212,240,68,.15)':'var(--border)'};
              border:2px solid ${i<audit.dayNumber-1?'var(--green)':i===audit.dayNumber-1?'var(--yellow)':'var(--border2)'};
              display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
              color:${i<audit.dayNumber-1?'#0f0f0f':i===audit.dayNumber-1?'var(--yellow)':'var(--muted)'};
              z-index:1;position:relative">
              ${i<audit.dayNumber-1?'✓':i+1}
            </div>
            ${!isLast?`<div style="position:absolute;top:13px;left:50%;width:100%;height:2px;background:${i<audit.dayNumber-1?'var(--green)':'var(--border)'};z-index:0"></div>`:''}
            <div style="font-size:9px;color:${i===audit.dayNumber-1?'var(--yellow)':'var(--muted)'};font-weight:${i===audit.dayNumber-1?700:400};white-space:nowrap">
              ${i===audit.dayNumber-1?'Idag':'Dag '+(i+1)}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- FOKUSOMRÅDEN (rotorsaker som klickbara kort) -->
    ${rootCauses.length ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div class="card" style="grid-column:1/-1">
        <div class="card-title">🔍 Identifierade problemområden</div>
        <div style="font-size:14px;color:var(--muted2);line-height:1.6;margin-bottom:16px">${a.real_problem||''}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${rootCauses.map((c,i)=>causeCard(c,i)).join('')}
        </div>
      </div>
    </div>` : ''}

    <!-- GRANSKNINGSPLAN som tidslinje -->
    <div class="section-row"><span class="section-label">Vad granskas – steg för steg</span></div>
    <div style="display:flex;flex-direction:column;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      ${auditPlan.map((p,i)=>{
        const st = i===0 ? {color:'var(--yellow)',bg:'rgba(212,240,68,.06)',border:'rgba(212,240,68,.2)',label:'Pågår'}
                 : i===1 ? {color:'var(--blue)',bg:'rgba(59,130,246,.05)',border:'rgba(59,130,246,.15)',label:'Nästa'}
                 : {color:'var(--muted)',bg:'transparent',border:'transparent',label:'Väntar'};
        return `<div style="display:flex;gap:0;border-bottom:${i<auditPlan.length-1?'1px solid var(--border)':'none'}">
          <!-- Dagmärke -->
          <div style="width:90px;flex-shrink:0;padding:16px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:${st.bg}">
            <div style="font-size:11px;font-weight:800;color:${st.color};text-align:center">${p.day}</div>
            <div style="font-size:9px;color:${st.color};background:${st.bg};border:1px solid ${st.border};padding:2px 7px;border-radius:20px;font-weight:700">${st.label}</div>
          </div>
          <!-- Innehåll -->
          <div style="flex:1;padding:16px 18px">
            <div style="font-size:14px;font-weight:700;margin-bottom:4px">${p.focus}</div>
            <div style="font-size:12px;color:var(--muted2);margin-bottom:10px;line-height:1.5">${p.why}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${(p.ai_will_check||[]).map(c=>`<span style="font-size:11px;color:var(--muted2);background:var(--border);padding:3px 10px;border-radius:20px">${c}</span>`).join('')}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- VECKOMÅL + AI-REKO sida vid sida -->
    ${(a.week_goal||a.ai_recommendation)?`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
      ${a.week_goal?`<div class="card" style="border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.06)">
        <div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">🎯 Mål efter 7 dagar</div>
        <div style="font-size:14px;line-height:1.65;color:var(--muted3)">${a.week_goal}</div>
      </div>`:''}
      ${a.ai_recommendation?`<div class="card" style="border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.06)">
        <div style="font-size:11px;font-weight:700;color:var(--purple);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">🤖 Trolig AI-lösning</div>
        <div style="font-size:14px;line-height:1.65;color:var(--muted3)">${a.ai_recommendation}</div>
      </div>`:''}
    </div>`:''}

    <!-- ONLINE-GRANSKNING som checklistekort -->
    ${a.online_checks&&a.online_checks.length?`
    <div class="card" style="margin-bottom:20px">
      <div class="card-title">Vad AI:n granskar online<span class="card-badge">Pågår</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${a.online_checks.map((c,i)=>`
        <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px">
          <div style="width:20px;height:20px;border-radius:50%;background:${i<2?'var(--green-dim,rgba(34,197,94,.12))':'var(--border)'};
            border:1.5px solid ${i<2?'var(--green)':'var(--border2)'};
            display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="font-size:10px;color:${i<2?'var(--green)':'var(--muted)'}">${i<2?'✓':'○'}</span>
          </div>
          <span style="font-size:12px;color:var(--muted2)">${c}</span>
        </div>`).join('')}
      </div>
    </div>`:''}

    <!-- AI VERKTYG -->
    <div class="section-row"><span class="section-label">AI-verktyg för er</span><span style="font-size:11px;color:var(--muted)">Baserat på er granskning</span></div>
    ${renderAiTools(a, audit.industry)}
    <div style="height:48px"></div>
  </div>`;
}

// ANALYZING ANIMATION
function renderAnalyzingState() {
  return `<div class="analyzing-wrap">
    <h2>AI:n analyserar er situation</h2>
    <p>Era svar är mottagna. AI:n söker nu upp information om ert företag och bygger en skräddarsydd granskningsplan.</p>
    <div>
      ${['Läser igenom era svar','Söker upp ert företag online','Analyserar er bransch och era utmaningar','Skapar er personliga granskningsplan'].map((t,i)=>`
      <div class="a-step"><div class="a-dot waiting" id="as${i}"></div><div class="a-step-text" id="at${i}">${t}</div></div>`).join('')}
    </div>
  </div>`;
}
function startAnalyzingAnimation() {
  let i=0;
  function next() {
    if (i>0){const p=document.getElementById(`as${i-1}`);const pt=document.getElementById(`at${i-1}`);if(p)p.className='a-dot done';if(pt)pt.className='a-step-text';}
    if (i<4){const c=document.getElementById(`as${i}`);const ct=document.getElementById(`at${i}`);if(c)c.className='a-dot active';if(ct)ct.className='a-step-text active';i++;setTimeout(next,i<4?2200:99999);}
  }
  setTimeout(next,400);
}

load();
</script>
</body>
</html>
