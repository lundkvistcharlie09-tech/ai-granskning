<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Granskning Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111214; --bg2: #18191c; --card: #1e2024; --border: #2c2e33; --border2: #3a3d44;
      --text: #f0f1f3; --muted: #4a4d57; --muted2: #767b8a; --muted3: #9ea4b4;
      --yellow: #d4f044; --yellow-dim: rgba(212,240,68,0.08);
      --green: #3ecf8e; --green-dim: rgba(62,207,142,0.1);
      --red: #f04040; --red-dim: rgba(240,64,64,0.08);
      --amber: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; animation:blink 2.4s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* SIDEBAR LAYOUT */
    .app-layout { display:flex; min-height:100vh; }

    /* SIDEBAR */
    .sidebar {
      width:220px; flex-shrink:0;
      background:var(--bg2); border-right:1px solid var(--border);
      position:fixed; top:0; left:0; height:100vh;
      display:flex; flex-direction:column;
      z-index:40; overflow:hidden;
    }
    .sidebar-top {
      padding:20px 16px 16px;
      border-bottom:1px solid var(--border);
    }
    .sidebar-logo {
      font-size:12px; font-weight:700; color:var(--muted2);
      letter-spacing:.5px; text-transform:uppercase; margin-bottom:12px;
    }
    .sidebar-company {
      display:flex; align-items:center; gap:10px;
    }
    .sidebar-co-logo {
      width:34px; height:34px; border-radius:8px;
      background:var(--card); border:1px solid var(--border2);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:var(--muted3); flex-shrink:0;
      overflow:hidden;
    }
    .sidebar-co-name { font-size:13px; font-weight:600; color:var(--text); line-height:1.3; }
    .sidebar-co-sub { font-size:11px; color:var(--muted2); margin-top:1px; }

    /* NAV */
    .sidebar-nav { flex:1; padding:12px 8px; overflow-y:auto; }
    .nav-item {
      display:flex; align-items:center; gap:10px;
      padding:9px 10px; border-radius:var(--radius-sm);
      font-size:13px; font-weight:500; color:var(--muted2);
      cursor:pointer; transition:background .12s, color .12s;
      margin-bottom:2px; text-decoration:none; border:none; background:none;
      width:100%; text-align:left;
    }
    .nav-item:hover { background:var(--border); color:var(--text); }
    .nav-item.active { background:rgba(212,240,68,.08); color:var(--yellow); }
    .nav-item svg { width:16px; height:16px; flex-shrink:0; opacity:.7; }
    .nav-item.active svg { opacity:1; }
    .nav-section-label {
      font-size:10px; font-weight:600; color:var(--muted);
      letter-spacing:.5px; padding:12px 10px 6px;
    }

    /* DAG-PROGRESS i sidebar */
    .sidebar-progress {
      padding:12px 16px; border-top:1px solid var(--border);
    }
    .sidebar-progress-label { font-size:11px; color:var(--muted2); margin-bottom:8px; display:flex; justify-content:space-between; }
    .sidebar-progress-label span { font-weight:600; color:var(--text); }
    .progress-bar-full { height:3px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:10px; }
    .progress-bar-fill { height:100%; border-radius:3px; background:var(--yellow); transition:width .6s; }
    .day-dots { display:flex; gap:4px; }
    .day-dot { flex:1; height:3px; border-radius:2px; background:var(--border); }
    .day-dot.done { background:var(--green); }
    .day-dot.active { background:var(--yellow); }

    /* SIDEBAR BOTTOM – profil */
    .sidebar-profile {
      padding:14px 16px; border-top:1px solid var(--border);
      display:flex; align-items:center; gap:10px;
    }
    .profile-avatar {
      width:30px; height:30px; border-radius:50%;
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .profile-name { font-size:12px; font-weight:600; color:var(--text); }
    .profile-role { font-size:11px; color:var(--muted2); }

    /* MAIN CONTENT */
    .main-content { margin-left:220px; flex:1; min-width:0; }
    .topbar {
      background:var(--bg2); border-bottom:1px solid var(--border);
      padding:0 28px; height:52px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:30;
    }
    .topbar-title { font-size:14px; font-weight:600; color:var(--text); }
    .tag-pill {
      font-size:11px; padding:4px 10px; border-radius:6px;
      border:1px solid var(--border2); color:var(--muted3); background:var(--bg);
      font-weight:500;
    }
    .tag-pill.yellow { color:var(--yellow); background:var(--yellow-dim); border-color:rgba(212,240,68,.2); }
    .tag-pill.green { color:var(--green); background:var(--green-dim); border-color:rgba(62,207,142,.2); }
    .dashboard-content { padding:32px 32px; min-width:0; }
    @media(max-width:800px) {
      .sidebar { transform:translateX(-100%); }
      .main-content { margin-left:0; }
    }

    /* COMPANY HEADER */
    .co-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:32px; gap:20px;
    }
    .co-left { display:flex; align-items:center; gap:14px; }
    .co-logo {
      width:44px; height:44px; border-radius:10px;
      background:var(--card); border:1px solid var(--border2);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:800; color:var(--muted3); flex-shrink:0;
    }
    .co-name { font-size:22px; font-weight:700; letter-spacing:-.6px; margin-bottom:3px; }
    .co-sub { font-size:12px; color:var(--muted2); display:flex; align-items:center; gap:7px; }
    .co-right { display:flex; align-items:center; gap:8px; }
    .progress-label { font-size:11px; color:var(--muted); margin-bottom:5px; }
    .progress-pct { font-size:24px; font-weight:800; letter-spacing:-1px; }
    .progress-bar { width:160px; height:2px; background:var(--border2); border-radius:2px; margin:6px 0 5px auto; overflow:hidden; }
    .progress-fill { height:100%; border-radius:2px; background:var(--yellow); }
    .progress-sub { font-size:11px; color:var(--muted); }

    /* STAT PILL – toprad med nyckeltal */
    .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:24px; border:1px solid var(--border); }
    @media(max-width:800px) { .stat-row { grid-template-columns:1fr 1fr; } }
    .stat-cell { background:var(--card); padding:20px 22px 18px; }
    .stat-cell-label { font-size:11px; color:var(--muted2); font-weight:500; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .stat-cell-val { font-size:28px; font-weight:700; letter-spacing:-1.2px; line-height:1; color:var(--text); }
    .stat-cell-change { font-size:12px; font-weight:600; margin-top:6px; display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:5px; }
    .stat-cell-change.pos { color:var(--green); background:var(--green-dim); }
    .stat-cell-change.neg { color:var(--red); background:var(--red-dim); }
    .stat-cell-change.neu { color:var(--muted2); background:transparent; }

    /* KPI GRID */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:24px; }
    @media(max-width:800px) { .kpi-grid { grid-template-columns:1fr 1fr; } }
    .kpi-card { background:var(--card); padding:20px 22px 18px; cursor:pointer; transition:background .12s; }
    .kpi-card:hover { background:#23262c; }
    .kpi-label { font-size:11px; color:var(--muted2); margin-bottom:10px; font-weight:500; }
    .kpi-value { font-size:28px; font-weight:700; letter-spacing:-1.2px; line-height:1; margin-bottom:10px; }
    .kpi-sparkline { height:36px; margin-bottom:8px; }
    .kpi-sparkline svg { width:100%; height:100%; overflow:visible; }
    .kpi-trend { font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:5px; }
    .kpi-trend.pos { color:var(--green); background:var(--green-dim); }
    .kpi-trend.neg { color:var(--red); background:var(--red-dim); }
    .kpi-trend.neu { color:var(--muted2); }

    /* MAIN CHART */
    .chart-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px 28px; margin-bottom:24px; }
    .chart-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
    .chart-title { font-size:15px; font-weight:600; color:var(--text); }
    .chart-subtitle { font-size:12px; color:var(--muted2); margin-top:3px; font-weight:400; }
    .chart-meta { font-size:11px; color:var(--muted); text-align:right; }
    .chart-wrap { height:220px; position:relative; }
    .chart-wrap svg { width:100%; height:100%; overflow:visible; }
    .annotation-bubble { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:#0f0f0f; background:var(--yellow); border-radius:5px; padding:3px 9px; white-space:nowrap; }
    .annotation-bubble.red { background:var(--red); color:#fff; }
    .annotation-bubble.green { background:var(--green); color:#0d1a12; }
    .chart-axis { display:flex; justify-content:space-between; margin-top:8px; padding:0 4px; }
    .chart-axis span { font-size:11px; color:var(--muted); }
    .chart-footnote { font-size:11px; color:var(--muted); margin-top:14px; display:flex; align-items:center; gap:6px; padding-top:14px; border-top:1px solid var(--border); }

    /* SECTION HEADER */
    .section-row { display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; }
    .section-label { font-size:14px; font-weight:600; color:var(--text); }

    /* DETAIL GRID */
    .detail-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:24px; }
    @media(max-width:900px) { .detail-grid { grid-template-columns:1fr 1fr; } }
    @media(max-width:580px) { .detail-grid { grid-template-columns:1fr; } }
    .detail-grid.two { grid-template-columns:1fr 1fr; }

    /* CARD */
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; }
    .card-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; }
    .card-badge { font-size:11px; font-weight:500; padding:3px 9px; border-radius:6px; background:var(--border); color:var(--muted2); }

    /* BIG STAT */
    .big-stat { font-size:34px; font-weight:700; letter-spacing:-1.5px; line-height:1; margin-bottom:4px; }
    .stat-sub { font-size:12px; color:var(--muted2); margin-bottom:14px; font-weight:400; }
    .sep { height:1px; background:var(--border); margin:16px 0; }

    /* BARS */
    .hbar-list { display:flex; flex-direction:column; gap:9px; }
    .hbar-row { display:flex; align-items:center; gap:10px; }
    .hbar-label { font-size:11px; color:var(--muted2); width:90px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hbar-track { flex:1; background:var(--border); border-radius:4px; height:5px; overflow:hidden; }
    .hbar-fill { height:100%; border-radius:4px; background:var(--border2); transition:width .4s; }
    .hbar-fill.blue { background:var(--blue); }
    .hbar-fill.yellow { background:var(--yellow); }
    .hbar-fill.red { background:var(--red); }
    .hbar-num { font-size:11px; font-weight:700; color:var(--muted3); width:22px; text-align:right; }

    /* FUNNEL */
    .funnel { display:flex; flex-direction:column; gap:7px; }
    .funnel-row { display:flex; align-items:center; gap:10px; }
    .funnel-label { font-size:11px; color:var(--muted2); width:95px; flex-shrink:0; }
    .funnel-track { flex:1; background:var(--border); border-radius:4px; height:6px; overflow:hidden; }
    .funnel-bar { height:100%; border-radius:4px; background:#383838; transition:width .5s; }
    .funnel-n { font-size:11px; font-weight:700; color:var(--muted3); width:26px; text-align:right; }
    .funnel-drop { font-size:10px; color:var(--red); font-weight:700; }

    /* HEALTH RING */
    .health-wrap { display:flex; align-items:center; gap:20px; }
    .health-ring { position:relative; width:80px; height:80px; flex-shrink:0; }
    .health-ring svg { transform:rotate(-90deg); }
    .health-ring circle { fill:none; stroke-width:6; }
    .health-ring .track { stroke:var(--border2); }
    .health-ring .fill { stroke-dasharray:283; stroke-linecap:round; transition:stroke-dashoffset .8s; }
    .health-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:18px; font-weight:700; }
    .health-info .label { font-size:14px; font-weight:600; margin-bottom:4px; color:var(--text); }
    .health-items { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
    .health-item { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted2); }
    .hdot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

    /* AI TOOLS */
    .ai-tools-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ai-tool-card {
      background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:16px; cursor:pointer; transition:border-color .12s, background .12s;
    }
    .ai-tool-card:hover { border-color:var(--border2); background:#1a1c20; }
    .ai-tool-icon { font-size:20px; margin-bottom:8px; }
    .ai-tool-name { font-size:13px; font-weight:600; margin-bottom:3px; color:var(--text); }
    .ai-tool-desc { font-size:11px; color:var(--muted2); line-height:1.5; }
    .ai-tool-tag {
      display:inline-block; margin-top:8px; font-size:10px; font-weight:600;
      color:var(--yellow); background:var(--yellow-dim);
      border:1px solid rgba(212,240,68,.2); border-radius:4px; padding:2px 7px;
    }
    .ai-tool-tag.soon { color:var(--muted); background:transparent; border-color:var(--border); }

    /* NOSHOW COST */
    .cost-highlight {
      background:var(--red-dim); border:1px solid rgba(240,64,64,.15);
      border-radius:var(--radius-sm); padding:12px 14px; margin-top:14px; font-size:12px; color:var(--muted3); line-height:1.6;
    }
    .cost-highlight strong { color:var(--red); font-size:15px; }

    /* INSIGHTS */
    .insight-list { display:flex; flex-direction:column; gap:8px; }
    .insight-item { padding:14px 16px; border-radius:var(--radius-sm); background:var(--bg); border:1px solid var(--border); font-size:13px; line-height:1.5; }
    .insight-item.high { border-left:2px solid var(--red); }
    .insight-item.medium { border-left:2px solid var(--amber); }
    .insight-item.low { border-left:2px solid var(--green); }
    .insight-title { font-weight:600; margin-bottom:3px; font-size:12px; color:var(--text); }
    .insight-desc { font-size:12px; color:var(--muted2); }

    /* CONNECT HINT */
    .connect-hint { margin-top:14px; font-size:12px; color:var(--muted2); background:var(--bg); border-radius:var(--radius-sm); padding:12px 14px; border:1px solid var(--border); line-height:1.5; }

    /* REPORT */
    .report-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:var(--yellow); color:#0d0e10; border:none;
      border-radius:var(--radius-sm); padding:10px 20px; font-size:13px; font-weight:700;
      font-family:'Inter',sans-serif; cursor:pointer; text-decoration:none; transition:opacity .12s;
    }
    .report-btn:hover { opacity:.88; }

    /* PENDING STATES */
    .setup-pending { max-width:400px; margin:100px auto; text-align:center; padding:0 20px; }
    .setup-icon { font-size:44px; margin-bottom:18px; }
    .setup-title { font-size:21px; font-weight:700; margin-bottom:8px; letter-spacing:-.4px; }
    .setup-sub { font-size:14px; color:var(--muted2); line-height:1.6; font-weight:400; }

    /* ANALYZING */
    .analyzing-wrap { max-width:480px; margin:80px auto; padding:0 20px; }
    .analyzing-wrap h2 { font-size:24px; font-weight:700; letter-spacing:-.6px; margin-bottom:10px; }
    .analyzing-wrap p { font-size:14px; color:var(--muted2); line-height:1.6; margin-bottom:28px; font-weight:400; }
    .a-step { display:flex; align-items:flex-start; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
    .a-step:last-child { border-bottom:none; }
    .a-dot { width:10px; height:10px; border-radius:50%; border:2px solid var(--border2); flex-shrink:0; margin-top:3px; transition:all .3s; }
    .a-dot.active { border-color:var(--yellow); background:var(--yellow); box-shadow:0 0 8px rgba(212,240,68,.35); animation:blink 1.5s infinite; }
    .a-dot.done { border-color:var(--green); background:var(--green); animation:none; }
    .a-step-text { font-size:13px; color:var(--muted); transition:color .3s; }
    .a-step-text.active { color:var(--text); font-weight:600; }

    /* WELCOME ANALYSIS */
    .plan-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    @media(max-width:700px) { .plan-cards { grid-template-columns:1fr; } }
    .plan-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; }
    .plan-day { font-size:10px; font-weight:600; color:var(--muted2); letter-spacing:.4px; margin-bottom:6px; }
    .plan-focus { font-size:14px; font-weight:600; margin-bottom:5px; color:var(--text); }
    .plan-why { font-size:12px; color:var(--muted2); margin-bottom:10px; line-height:1.5; }
    .plan-check { font-size:11px; color:var(--muted2); display:flex; gap:6px; margin-bottom:3px; }
    .plan-check::before { content:'→'; color:var(--purple); flex-shrink:0; }

    /* FADE-IN SCROLL ANIMATIONER */
    .fade-in {
      opacity:0; transform:translateY(18px);
      transition: opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
    }
    .fade-in.visible { opacity:1; transform:translateY(0); }
    .fade-in:nth-child(1) { transition-delay:.05s; }
    .fade-in:nth-child(2) { transition-delay:.1s; }
    .fade-in:nth-child(3) { transition-delay:.15s; }
    .fade-in:nth-child(4) { transition-delay:.2s; }
    .fade-in:nth-child(5) { transition-delay:.25s; }
    .fade-in:nth-child(6) { transition-delay:.3s; }

    /* SECTION DIVIDER */
    .section-divider { height:1px; background:var(--border); margin:32px 0; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:5px; }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">AI-Granskning</div>
      <div class="sidebar-company" id="sidebarCompany">
        <div class="sidebar-co-logo" id="sidebarLogo">?</div>
        <div>
          <div class="sidebar-co-name" id="sidebarName">Laddar...</div>
          <div class="sidebar-co-sub" id="sidebarIndustry"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section-label">Navigering</div>
      <button class="nav-item active" onclick="navTo('oversikt',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Översikt
      </button>
      <button class="nav-item" onclick="navTo('plan',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Granskningsplan
      </button>
      <button class="nav-item" onclick="navTo('aiverktyg',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        AI-verktyg
      </button>
      <button class="nav-item" onclick="navTo('rapport',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Rapport
      </button>
    </div>

    <div class="sidebar-progress" id="sidebarProgress">
      <div class="sidebar-progress-label">Granskningsstatus <span id="sidebarDayLabel">Dag 1/7</span></div>
      <div class="day-dots" id="dayDots">
        ${Array.from({length:7},(_,i)=>`<div class="day-dot" id="dd${i}"></div>`).join('')}
      </div>
    </div>

    <div class="sidebar-profile">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div>
        <div class="profile-name" id="profileName">Laddar...</div>
        <div class="profile-role">Kund</div>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">Översikt</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="live-dot"></span>
        <span style="font-size:11px;color:var(--muted2);font-weight:500">Live</span>
      </div>
    </div>
    <div id="root" style="min-height:80vh"></div>
  </div>

</div>

<script>
const token = location.pathname.split('/')[2];
let _data = null;

async function load() {
  if (!token) { showError('Åtkomst saknas','Öppna länken du fick från din konsult.','🔑'); return; }
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (!r.ok) throw new Error();
    _data = await r.json();
    render(_data);
  } catch(e) { showError('Ogiltig länk','Kontakta din konsult för en ny länk.','🔒'); }
}

function showError(title, sub, icon) {
  document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">${icon}</div><div class="setup-title">${title}</div><div class="setup-sub">${sub}</div></div>`;
}

setInterval(async () => {
  if (!token) return;
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (r.ok) { _data = await r.json(); render(_data); }
  } catch(e) {}
}, 30000);

// ══════════════════════════════════════
// COMPANY LOGO – favicon eller initialer
// ══════════════════════════════════════
function companyLogo(audit, initials) {
  const site = audit.welcomeWebsite || '';
  if (site) {
    let domain = site.replace(/^https?:\/\//, '').split('/')[0];
    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
    return `<div class="co-logo" style="overflow:hidden;padding:0;background:#1c1c1c">
      <img src="${faviconUrl}" width="52" height="52" style="object-fit:contain;border-radius:12px"
        onerror="this.parentElement.innerHTML='${initials}';this.parentElement.style.padding='';this.parentElement.style.overflow='';this.parentElement.style.fontSize='18px';this.parentElement.style.fontWeight='800';this.parentElement.style.color='var(--muted3)'"/>
    </div>`;
  }
  return `<div class="co-logo">${initials}</div>`;
}

// Navigering
let _currentSection = 'oversikt';
function navTo(section, el) {
  _currentSection = section;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  const titles = { oversikt:'Översikt', plan:'Granskningsplan', aiverktyg:'AI-verktyg', rapport:'Rapport' };
  document.getElementById('topbarTitle').textContent = titles[section]||'Översikt';
  if(_data) render(_data);
}

function updateSidebar(audit) {
  const initials = (audit.companyName||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  // Logo
  const logoEl = document.getElementById('sidebarLogo');
  const site = audit.welcomeWebsite||'';
  if(site) {
    const domain = site.replace(/^https?:\/\//,'').split('/')[0];
    logoEl.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" width="34" height="34" style="object-fit:contain;border-radius:7px" onerror="this.parentElement.textContent='${initials}'"/>`;
    logoEl.style.padding = '0';
  } else {
    logoEl.textContent = initials;
  }
  document.getElementById('sidebarName').textContent = audit.companyName||'Företag';
  document.getElementById('sidebarIndustry').textContent = audit.industry||'';
  document.getElementById('sidebarDayLabel').textContent = `Dag ${audit.dayNumber}/7`;
  // Day dots
  for(let i=0;i<7;i++){
    const d=document.getElementById('dd'+i);
    if(!d)continue;
    d.className='day-dot'+(i<audit.dayNumber-1?' done':i===audit.dayNumber-1?' active':'');
  }
  // Profile
  document.getElementById('profileAvatar').textContent = initials;
  document.getElementById('profileName').textContent = audit.companyName||'Kund';
}

function render(data) {
  const { audit, kpis, funnel, dropoffStep, bookingsPerDay, emailCategories, manualTime, healthScore, insights } = data;
  const modules = audit.aiModules || [];

  const initials = (audit.companyName||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  updateSidebar(audit);

  if (!audit.setupComplete || !modules.length) {
    if (audit.welcomeComplete && audit.aiWelcomeAnalysis) {
      document.getElementById('root').innerHTML = renderWelcomeAnalysis(audit, kpis, bookingsPerDay, manualTime);
      initFadeIn();
    } else if (audit.welcomeComplete) {
      document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">🔍</div><div class="setup-title">AI:n analyserar er situation</div><div class="setup-sub">Era svar är mottagna. Sidan uppdateras automatiskt.</div></div>`;
      let n=0; const pi=setInterval(async()=>{
        if(++n>30){clearInterval(pi);return;}
        try{const r=await fetch('/api/dashboard',{headers:{'x-audit-token':token}});
        if(!r.ok)return; const f=await r.json();
        if(f.audit?.aiWelcomeAnalysis){clearInterval(pi);setTimeout(()=>location.reload(),400);}}catch(e){}
      },4000);
    } else {
      document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">⚙️</div><div class="setup-title">Dashboard konfigureras</div><div class="setup-sub">Din personliga AI-dashboard håller på att byggas upp.</div></div>`;
    }
    return;
  }

  const dayPct = Math.round((audit.dayNumber/7)*100);
  let html = `<div class="container">`;

  // ── COMPANY HEADER
  html += `<div class="co-header">
    <div class="co-left">
      ${logoHtml}
      <div>
        <div class="co-name">${audit.companyName}</div>
        <div class="co-sub">
          <span>${audit.industry||'Företag'}</span>
          <span style="color:var(--border2)">·</span>
          <span class="tag-pill green" style="font-size:11px">● Aktiv granskning</span>
        </div>
      </div>
    </div>
    <div class="co-right">
      <div class="progress-label">Granskningsframsteg</div>
      <div class="progress-pct">${dayPct}%</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${dayPct}%"></div></div>
      <div class="progress-sub">${audit.daysLeft>0?`${audit.daysLeft} dagar kvar`:'Avslutad'}</div>
    </div>
  </div>`;

  // ── KPI STRIP (5 kort)
  html += renderKpiStrip(kpis, modules, bookingsPerDay, manualTime, []);



  // ── AI TOOLS (anpassade efter analys)
  if (audit.aiWelcomeAnalysis) {
    html += `<div class="section-row"><span class="section-label">AI-verktyg för er</span><span style="font-size:11px;color:var(--muted)">Baserat på er granskning</span></div>`;
    html += renderAiTools(audit.aiWelcomeAnalysis, audit.industry);
  }

  // ── DETAIL GRID
  const detailCards = [];
  if (modules.includes('bookings')||modules.includes('noshow')) detailCards.push(renderNoShowCard(kpis, bookingsPerDay));
  if (modules.includes('email')) detailCards.push(renderEmailCard(emailCategories));
  if (modules.includes('funnel')) detailCards.push(renderFunnelCard(funnel, dropoffStep));
  if (modules.includes('manual_time')) detailCards.push(renderTimeCard(manualTime));
  if (modules.includes('invoicing')) detailCards.push(renderInvoiceCard());
  if (modules.includes('social')) detailCards.push(renderSocialCard());
  if (modules.includes('visitors')) detailCards.push(renderVisitorsCard(kpis));
  detailCards.push(renderHealthCard(healthScore, kpis));

  if (detailCards.length) {
    html += `<div class="section-row"><span class="section-label">Detaljerad analys</span></div>`;
    html += `<div class="detail-grid">${detailCards.join('')}</div>`;
  }

  // ── INSIGHTS
  if (insights && insights.length) {
    html += `<div class="section-row"><span class="section-label">AI-insikter</span></div>`;
    html += `<div class="insight-list">${insights.map(i=>`<div class="insight-item ${i.priority||'medium'}"><div class="insight-title">${i.title||''}</div><div class="insight-desc">${i.description||''}</div></div>`).join('')}</div>`;
  }

  // ── REPORT
  html += `<div class="section-row" style="margin-top:32px"><span class="section-label">Slutrapport</span></div>
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <div style="font-weight:700;font-size:15px;margin-bottom:4px">AI-genererad analysrapport</div>
      <div style="font-size:13px;color:var(--muted2)">${audit.daysLeft>0?`Rapporten genereras dag 7 – om ${audit.daysLeft} dag${audit.daysLeft!==1?'ar':''}. `:'Granskningen är klar.'}</div>
    </div>
    <a href="/dashboard/${token}/report" class="report-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      ${audit.daysLeft>0?'Förhandsgranska':'Öppna rapport'}
    </a>
  </div>
  <div style="height:48px"></div></div>`;

  document.getElementById('root').innerHTML = html;
}

// ══════════════════════════════════════
// MAIN CHART – alla problem i ett diagram
// ══════════════════════════════════════
function renderMainChart(bookingsPerDay, audit) {
  const dayNum = audit.dayNumber || 1;
  const a = audit.aiWelcomeAnalysis || {};
  const causes = (a.likely_root_causes || []).slice(0, 5);
  const uid = Math.random().toString(36).slice(2,8);

  const COLORS = ['#d4f044','#3b82f6','#f59e0b','#22c55e','#8b5cf6'];
  const SEVERITY_CURVES = [
    [72, 74, 76, 78, 79, 80, 82],
    [45, 50, 55, 58, 61, 63, 65],
    [30, 35, 42, 48, 50, 52, 55],
    [60, 61, 63, 65, 66, 68, 70],
    [20, 25, 30, 35, 38, 40, 42],
  ];

  const W=700, H=200, padL=36, padR=16, padT=28, padB=8;
  const iW=W-padL-padR, iH=H-padT-padB;

  function xOf(i) { return padL + (i/6)*iW; }
  function yOf(v) { return padT + iH - (v/100)*iH*0.9; }

  function bezier(pts) {
    if (pts.length < 2) return pts.length===1 ? `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}` : '';
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i=1;i<pts.length;i++) {
      const cx = pts[i-1][0] + (pts[i][0]-pts[i-1][0])*0.4;
      d += ` C ${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)}, ${cx.toFixed(1)} ${pts[i][1].toFixed(1)}, ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
    }
    return d;
  }

  const bottom = padT + iH;

  // Gridlinjer (horisontella Y-axeln)
  const gridLines = [25,50,75,100].map(v => {
    const y = yOf(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#252830" stroke-width="1"/>
      <text x="${(padL-5).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#3a3d44" font-size="9" font-family="Inter,sans-serif">${v}%</text>`;
  }).join('');

  // Bygg en linje + area per problem
  let problemLines = '';
  causes.forEach((cause, ci) => {
    const color = COLORS[ci];
    const curve = SEVERITY_CURVES[ci] || SEVERITY_CURVES[0];
    const knownVals = curve.slice(0, dayNum);
    const pts = knownVals.map((v,i) => [xOf(i), yOf(v)]);
    if (pts.length < 1) return;
    const linePath = bezier(pts);
    const areaPath = linePath && pts.length >= 2
      ? `${linePath} L${pts[pts.length-1][0].toFixed(1)} ${bottom} L${pts[0][0].toFixed(1)} ${bottom} Z`
      : '';
    const gradId = `pg${uid}c${ci}`;
    let dashedLine = '';
    if (dayNum < 7) {
      const lastPt = pts[pts.length-1];
      dashedLine = `<line x1="${lastPt[0].toFixed(1)}" y1="${lastPt[1].toFixed(1)}" x2="${xOf(6).toFixed(1)}" y2="${yOf(curve[6]).toFixed(1)}"
        stroke="${color}" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>`;
    }
    const lastPt = pts[pts.length-1];
    const dot = `<circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="${pts.length===dayNum?5:3}"
      fill="${pts.length===dayNum?color:'none'}" stroke="${color}" stroke-width="1.5" opacity="${pts.length===dayNum?1:0.6}"/>`;
    problemLines += `
      <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${areaPath ? `<path d="${areaPath}" fill="url(#${gradId})"/>` : ''}
      ${linePath ? `<path d="${linePath}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>` : ''}
      ${dashedLine}${dot}`;
  });

  if (!causes.length) {
    const pts = Array.from({length:dayNum},(_,i)=>[xOf(i), yOf(20+i*8)]);
    const lp = bezier(pts);
    problemLines = lp ? `<path d="${lp}" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="4,4"/>` : '';
  }

  const legend = causes.length > 0 ? `
    <div style="display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      ${causes.map((cause, ci) => `
        <div style="display:flex;align-items:center;gap:6px">
          <span style="width:24px;height:3px;border-radius:2px;background:${COLORS[ci]};display:inline-block;flex-shrink:0"></span>
          <span style="font-size:11px;color:var(--muted2);line-height:1.3;max-width:200px">${cause}</span>
        </div>`).join('')}
    </div>` : '';

  const tooltipData = Array.from({length:7},(_,i) => ({
    label: 'Dag '+(i+1),
    known: i < dayNum,
    problems: causes.map((cause, ci) => ({ name: cause, value: SEVERITY_CURVES[ci][i], color: COLORS[ci] }))
  }));

  setTimeout(() => {
    const chartEl = document.getElementById('chart-'+uid);
    const tooltip = document.getElementById('ctt-'+uid);
    const crosshair = document.getElementById('cth-'+uid);
    if (!chartEl) return;
    chartEl.addEventListener('mousemove', function(e) {
      const rect = chartEl.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      const pct = (relX - padL * rect.width / W) / (iW * rect.width / W);
      const idx = Math.max(0, Math.min(6, Math.round(pct * 6)));
      const d = tooltipData[idx];
      const inner = d.problems.length > 0
        ? `<div style="font-size:11px;color:#666;margin-bottom:6px">${d.label}${!d.known?' · estimat':''}</div>`
          + d.problems.map(p => `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <span style="width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0"></span>
              <span style="font-size:10px;color:#aaa;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">${p.name}</span>
              <span style="font-size:12px;font-weight:700;color:${p.color}">${p.value}%</span>
            </div>`).join('')
        : `<div style="font-size:11px;color:#555">${d.label} · väntar</div>`;
      tooltip.innerHTML = inner;
      let left = relX + 14;
      if (left + 180 > rect.width) left = relX - 185;
      tooltip.style.left = left+'px';
      tooltip.style.top = '8px';
      tooltip.style.display = 'block';
      crosshair.style.left = relX+'px';
      crosshair.style.display = 'block';
    });
    chartEl.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
      crosshair.style.display = 'none';
    });
  }, 0);

  const topSeverity = causes.length > 0 ? Math.max(...causes.map((_,ci) => SEVERITY_CURVES[ci][dayNum-1])) : null;

  return `<div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Problemsammanfattning</div>
        <div class="chart-subtitle">Allvarlighetsgrad per rotorsak · ${audit.companyName}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        ${topSeverity !== null ? `<div style="text-align:right">
          <div style="font-size:11px;color:var(--muted2);margin-bottom:3px;font-weight:400">Högsta allvarlighet</div>
          <div style="font-size:20px;font-weight:700;letter-spacing:-.6px;color:${topSeverity>70?'var(--red)':topSeverity>45?'var(--amber)':'var(--green)'};line-height:1">${topSeverity}%</div>
        </div>` : ''}
      </div>
    </div>
    <div style="height:220px;position:relative" id="chart-${uid}">
      <div id="ctt-${uid}" style="display:none;position:absolute;pointer-events:none;z-index:10;
        background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;
        box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:160px;max-width:200px"></div>
      <div id="cth-${uid}" style="display:none;position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.04);pointer-events:none;z-index:5"></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
        ${gridLines}${problemLines}
        <rect x="${padL}" y="${padT}" width="${iW}" height="${iH}" fill="transparent"/>
      </svg>
    </div>
    ${legend}
    <div class="chart-footnote">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      AI-estimerad allvarlighetsgrad · uppdateras varje dag · streckad linje = prognos
    </div>
  </div>`;
}

function initChartTooltip(cfg) {
  const chartEl = document.getElementById('chart-'+cfg.uid);
  const tooltip  = document.getElementById('ctt-'+cfg.uid);
  const crosshair= document.getElementById('cth-'+cfg.uid);
  const ttDay    = document.getElementById('ctt-day-'+cfg.uid);
  const ttVal    = document.getElementById('ctt-val-'+cfg.uid);
  const ttSub    = document.getElementById('ctt-sub-'+cfg.uid);
  if (!chartEl) return;

  chartEl.addEventListener('mousemove', function(e) {
    const rect = chartEl.getBoundingClientRect();
    const relX = e.clientX - rect.left;
    const pct = (relX - cfg.padL * rect.width / cfg.svgW) / (cfg.iW * rect.width / cfg.svgW);
    const idx = Math.round(pct * (cfg.dayData.length - 1));
    if (idx < 0 || idx >= cfg.dayData.length) return;
    const d = cfg.dayData[idx];
    ttDay.textContent = d.label;
    ttVal.textContent = d.value !== null ? (cfg.hasData ? d.value + ' ' + d.sub : 'Pågår') : 'Ingen data';
    ttSub.textContent = d.value !== null ? d.sub : '–';
    let left = relX + 12;
    if (left + 140 > rect.width) left = relX - 140;
    tooltip.style.left = left + 'px';
    tooltip.style.top = '10px';
    tooltip.style.display = 'block';
    crosshair.style.left = relX + 'px';
    crosshair.style.display = 'block';
  });
  chartEl.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
    crosshair.style.display = 'none';
  });
}

// ══════════════════════════════════════
// KPI STRIP – dynamiska kort från AI
// ══════════════════════════════════════
function renderKpiStrip(kpis, modules, bookingsPerDay, manualTime, kpiCards) {
  const colorMap = {
    blue:   '#3b82f6',
    green:  '#22c55e',
    amber:  '#f59e0b',
    yellow: '#d4f044',
    purple: '#8b5cf6'
  };

  // Om AI returnerat kpi_cards – rendera dem
  if (kpiCards && kpiCards.length > 0) {
    const cols = Math.min(kpiCards.length, 5);
    return `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px">
      ${kpiCards.map(card => {
        const col = colorMap[card.color] || '#3b82f6';
        const metrics = (card.metrics || []).slice(0, 5);
        return `<div style="background:var(--card);padding:18px 20px 16px">
          <div style="font-size:11px;color:${col};font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px">
            <span style="width:5px;height:5px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0"></span>
            ${card.title}
          </div>
          ${metrics.map((m, i) => `
            <div style="${i>0?'padding-top:8px;border-top:1px solid var(--border);margin-top:8px':''}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px">
                <span style="font-size:11px;color:var(--muted2);font-weight:400">${m.label}</span>
                ${m.trend ? `<span style="font-size:10px;font-weight:600;color:${m.trendUp?'var(--green)':'var(--red)'};flex-shrink:0;padding:1px 6px;border-radius:4px;background:${m.trendUp?'rgba(62,207,142,.1)':'rgba(240,64,64,.08)'}">${m.trend}</span>` : ''}
              </div>
              <div style="display:flex;align-items:baseline;gap:5px">
                <span style="font-size:20px;font-weight:700;letter-spacing:-0.6px;line-height:1;color:var(--text)">${m.value}</span>
                ${m.note ? `<span style="font-size:10px;color:var(--muted2)">${m.note}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>`;
      }).join('')}

function renderAiTools(analysis, industry) {
  // Generera relevanta verktyg baserat på analysen
  const rec = (analysis.ai_recommendation||'').toLowerCase();
  const problem = (analysis.real_problem||'').toLowerCase();
  const causes = (analysis.likely_root_causes||[]).join(' ').toLowerCase();
  const all = rec + ' ' + problem + ' ' + causes;

  const tools = [];

  // Alltid relevant
  tools.push({
    icon:'🤖',
    name:'AI-receptionist',
    desc:'Svarar automatiskt på vanliga frågor via mejl och chatt, dygnet runt.',
    tag:'Rekommenderat',
    hot:true
  });

  if (all.includes('bokning')||all.includes('no-show')||all.includes('påminn')) {
    tools.push({ icon:'📅', name:'Bokningspåminnelse', desc:'Skickar automatiska SMS/mejl-påminnelser 24h och 2h innan bokad tid.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('recension')||all.includes('google')||all.includes('betyg')||all.includes('review')) {
    tools.push({ icon:'⭐', name:'Recensionsbot', desc:'Följer automatiskt upp nöjda kunder med en länk till Google Reviews.', tag:'Hög prioritet', hot:true });
  }
  if (all.includes('återkommande')||all.includes('lojalitet')||all.includes('uppföljning')) {
    tools.push({ icon:'💌', name:'Kunduppföljning', desc:'Kontaktar automatiskt kunder som inte bokat på 30+ dagar med ett erbjudande.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('mejl')||all.includes('e-post')||all.includes('svar')) {
    tools.push({ icon:'✉️', name:'Mejl-AI', desc:'Sorterar, prioriterar och svarar på vanliga mejl automatiskt.', tag:'Rekommenderat', hot:true });
  }
  if (all.includes('faktura')||all.includes('betalning')) {
    tools.push({ icon:'🧾', name:'Faktura-automation', desc:'Skickar påminnelser för obetalda fakturor och skapar fakturor automatiskt.', tag:'Kan spara tid', hot:false });
  }
  if (all.includes('social')||all.includes('instagram')||all.includes('facebook')) {
    tools.push({ icon:'📱', name:'Social media-AI', desc:'Genererar och schemalägger inlägg för Instagram och Facebook automatiskt.', tag:'Kan spara tid', hot:false });
  }

  // Alltid med som "kommer snart"
  tools.push({ icon:'📊', name:'Rapport-AI', desc:'Veckovis AI-genererad rapport om er verksamhet med konkreta åtgärder.', tag:'Kommer snart', soon:true });
  tools.push({ icon:'🔍', name:'Konkurrentanalys', desc:'Bevakar era konkurrenters recensioner, priser och sociala medier.', tag:'Kommer snart', soon:true });

  const shown = tools.slice(0,8);

  return `<div class="ai-tools-grid">
    ${shown.map(t=>`<div class="ai-tool-card">
      <div class="ai-tool-icon">${t.icon}</div>
      <div class="ai-tool-name">${t.name}</div>
      <div class="ai-tool-desc">${t.desc}</div>
      <span class="ai-tool-tag${t.soon?' soon':''}">${t.tag}</span>
    </div>`).join('')}
  </div>`;
}

  const f=funnel||[];

        return `<div class="funnel-row">

          <div class="funnel-track"><div class="funnel-bar" style="width:${Math.round(s.count/maxV*100)}%;${isD?'background:var(--red)':''}"></div></div>
          <span class="funnel-n">${s.count}</span>

function renderWelcomeAnalysis(audit, kpis={}, bookingsPerDay=[], manualTime={}) {
  const a = audit.aiWelcomeAnalysis;
  const auditPlan = a.audit_plan || [];
  const rootCauses = a.likely_root_causes || [];
  const initials = (audit.companyName||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const logoHtml = companyLogo(audit, initials);
  const dayPct = Math.round((audit.dayNumber/7)*100);

  // Statusikon för granskningssteg
  function stepStatus(idx) {
    if (idx < audit.dayNumber - 1) return { icon:'✓', color:'var(--green)', label:'Klar' };
    if (idx === audit.dayNumber - 1) return { icon:'●', color:'var(--yellow)', label:'Pågår nu' };
    return { icon:'○', color:'var(--muted)', label:'Väntar' };
  }

  // Rotorsakskort – visar vad som KOMMER att mätas
  function causeCard(cause, i) {
    const icons = ['🔍','⚡','📉','🔄','💬','⚠️'];
    return `<div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)">
      <div style="font-size:16px;flex-shrink:0;margin-top:1px">${icons[i%icons.length]}</div>
      <div>
        <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px">${cause}</div>
        <div style="font-size:11px;color:var(--muted2)">Granskas dag ${i<2?'1–2':i<4?'3–4':'5–7'}</div>
      </div>
    </div>`;
  }

  // Räkna ut hur lång linjen ska vara (andel av vägen)
  const doneDays = Math.max(0, audit.dayNumber - 1);
  const spineFillPct = (doneDays / 6) * 100;

  // Spine – 7 dag-noder vertikalt
  const spineNodes = Array.from({length:7}, (_,i) => {
    const done = i < audit.dayNumber - 1;
    const active = i === audit.dayNumber - 1;
    const cls = done ? 'done' : active ? 'active' : 'waiting';
    const labelCls = done ? 'done' : active ? 'active' : '';
    return `<div class="spine-day">
      <div class="spine-bubble ${cls}">${done ? `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>` : (i+1)}</div>
      <div class="spine-label ${labelCls}">${active ? 'Idag' : 'D'+(i+1)}</div>
    </div>`;
  }).join('');

  return `<div class="dashboard-content">

      <!-- HEADER -->
      <div class="co-header fade-in">
        <div class="co-left">
          ${logoHtml}
          <div>
            <div class="co-name">${audit.companyName}</div>
            <div class="co-sub">
              <span style="color:var(--muted2)">${audit.industry||'Företag'}</span>
              <span style="color:var(--border2)">·</span>
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:500"><span class="live-dot" style="width:5px;height:5px"></span>Granskning pågår</span>
            </div>
          </div>
        </div>
        <div class="co-right">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="text-align:right">
              <div style="font-size:11px;color:var(--muted2);margin-bottom:3px;font-weight:500">Granskningsdag</div>
              <div style="font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1">Dag ${audit.dayNumber}<span style="font-size:13px;font-weight:400;color:var(--muted2)">/7</span></div>
              <div style="font-size:11px;color:var(--muted2);margin-top:2px">${audit.daysLeft > 0 ? `${audit.daysLeft} dagar kvar` : 'Avslutad'}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- KPI STRIP -->
      <div class="fade-in">${renderKpiStrip(kpis, [], bookingsPerDay, manualTime, a.kpi_cards || [])}</div>

      <!-- LINJEDIAGRAM -->
      <div class="fade-in">${renderMainChart(bookingsPerDay, audit)}</div>

      <!-- FOKUSOMRÅDEN (rotorsaker som klickbara kort) -->
      ${rootCauses.length ? `
      <div style="margin-bottom:24px" class="fade-in">
        <div class="card">
          <div class="card-title">Identifierade problemområden</div>
          <div style="font-size:13px;color:var(--muted2);line-height:1.65;margin-bottom:16px;font-weight:400">${a.real_problem||''}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            ${rootCauses.map((c,i)=>causeCard(c,i)).join('')}
          </div>
        </div>
      </div>` : ''}

      <!-- GRANSKNINGSPLAN som tidslinje -->
      <div class="section-row fade-in" style="margin-bottom:16px"><span class="section-label">Granskningsplan</span></div>
      <div class="fade-in" style="display:flex;flex-direction:column;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)">
        ${auditPlan.map((p,i)=>{

              </div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <!-- VECKOMÅL + AI-REKO sida vid sida -->
      ${(a.week_goal||a.ai_recommendation)?`
      <div class="fade-in" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px">
        ${a.week_goal?`<div class="card" style="border-color:rgba(62,207,142,.2);background:rgba(62,207,142,.04)">
          <div style="font-size:11px;font-weight:600;color:var(--green);margin-bottom:10px">Mål efter 7 dagar</div>

          <div style="font-size:11px;font-weight:600;color:var(--purple);margin-bottom:10px">Trolig AI-lösning</div>

        </div>`:''}

      <!-- ONLINE-GRANSKNING som checklistekort -->
      ${a.online_checks&&a.online_checks.length?`

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${a.online_checks.map((c,i)=>`
          <div style="display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)">

              <span style="font-size:9px;color:${i<2?'var(--green)':'var(--muted)'}">${i<2?'✓':'○'}</span>

      <!-- AI VERKTYG -->

  function next() {
    if (i>0){const p=document.getElementById(`as${i-1}`);const pt=document.getElementById(`at${i-1}`);if(p)p.className='a-dot done';if(pt)pt.className='a-step-text';}
    if (i<4){const c=document.getElementById(`as${i}`);const ct=document.getElementById(`at${i}`);if(c)c.className='a-dot active';if(ct)ct.className='a-step-text active';i++;setTimeout(next,i<4?2200:99999);}
  }
  setTimeout(next,400);
}

// ══════════════════════════════════════
// SCROLL FADE-IN ANIMATIONER
// ══════════════════════════════════════
function initFadeIn() {
  setTimeout(() => {
    const els = document.querySelectorAll('.fade-in');
    if ('IntersectionObserver' in window) {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.08 });
      els.forEach(el => obs.observe(el));
    } else {
      els.forEach(el => el.classList.add('visible'));
    }
  }, 50);
}

load();
</script>
