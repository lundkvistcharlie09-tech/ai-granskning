<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Granskning Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --bg2: #141414;
      --card: #1a1a1a;
      --card2: #202020;
      --border: #2a2a2a;
      --border2: #333;
      --text: #f0f0f0;
      --muted: #666;
      --muted2: #888;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.12);
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.12);
      --purple: #8b5cf6;
      --purple-dim: rgba(139,92,246,0.12);
      --radius: 12px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }

    /* ── TOPBAR ─────────────────────────── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      font-size: 13px; font-weight: 700; color: var(--muted2);
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .topbar-center { display: flex; align-items: center; gap: 10px; }
    .company-tag {
      font-size: 14px; font-weight: 700; color: var(--text);
    }
    .industry-tag {
      font-size: 11px; color: var(--muted2);
      background: var(--card); border: 1px solid var(--border2);
      padding: 3px 10px; border-radius: 20px;
    }
    .day-badge {
      font-size: 11px; font-weight: 700;
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(34,197,94,0.25);
      padding: 3px 10px; border-radius: 20px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── LAYOUT ─────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 28px; }

    /* ── COMPANY HEADER ─────────────────── */
    .company-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 36px; gap: 20px;
    }
    .company-header-left { display: flex; align-items: center; gap: 20px; }
    .company-logo-box {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: var(--muted2);
      flex-shrink: 0;
    }
    .company-info {}
    .company-name-big {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .company-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meta-pill {
      font-size: 11px; color: var(--muted2);
      background: var(--card); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 20px;
    }
    .meta-pill.green { color: var(--green); background: var(--green-dim); border-color: rgba(34,197,94,0.2); }
    .company-header-right { text-align: right; flex-shrink: 0; }
    .audit-status-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .audit-progress-bar {
      width: 180px; height: 4px;
      background: var(--border2); border-radius: 4px;
      overflow: hidden; margin-top: 8px;
    }
    .audit-progress-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--green), #16a34a);
      transition: width 0.6s ease;
    }

    /* ── KPI ROW ────────────────────────── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    @media(max-width:800px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
    @media(max-width:450px) { .kpi-row { grid-template-columns: 1fr; } }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .kpi-card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }
    .kpi-card.active { border-color: var(--blue); }
    .kpi-label {
      font-size: 11px; font-weight: 600; color: var(--muted2);
      letter-spacing: 0.3px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .kpi-value {
      font-size: 32px; font-weight: 800; letter-spacing: -1.5px;
      line-height: 1; margin-bottom: 10px;
    }
    .kpi-unit { font-size: 14px; font-weight: 500; color: var(--muted2); }
    .kpi-sparkline { height: 36px; width: 100%; }
    .kpi-sparkline svg { width: 100%; height: 100%; }
    .kpi-trend {
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
      margin-top: 6px;
    }
    .kpi-trend.up { color: var(--green); }
    .kpi-trend.down { color: var(--red); }
    .kpi-trend.neutral { color: var(--muted2); }

    /* ── MAIN GRID ──────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media(max-width:900px) { .main-grid { grid-template-columns: 1fr; } }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media(max-width:900px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width:600px) { .detail-grid { grid-template-columns: 1fr; } }

    /* ── CARD ────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; color: var(--muted2);
      letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; background: var(--border); color: var(--muted2);
      text-transform: none; letter-spacing: 0;
    }

    /* ── CHART: 7-DAR AKTIVITET ─────────── */
    .activity-chart { height: 160px; position: relative; margin-top: 8px; }
    .activity-chart svg { width: 100%; height: 100%; }

    /* ── BAR CHART ──────────────────────── */
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-top: 4px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
    .bar {
      width: 100%; background: var(--border2);
      border-radius: 4px 4px 0 0;
      transition: height 0.4s cubic-bezier(.4,0,.2,1);
      min-height: 3px;
    }
    .bar.filled { background: #3a3a3a; }
    .bar.today { background: var(--blue); }
    .bar.today:hover { background: #60a5fa; }
    .bar-day { font-size: 10px; color: var(--muted); }
    .bar-num { font-size: 10px; font-weight: 700; color: var(--muted2); }

    /* ── FUNNEL ─────────────────────────── */
    .funnel { display: flex; flex-direction: column; gap: 8px; }
    .funnel-row { display: flex; align-items: center; gap: 10px; }
    .funnel-label { font-size: 11px; color: var(--muted2); width: 100px; flex-shrink: 0; }
    .funnel-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 7px; overflow: hidden; }
    .funnel-bar { height: 100%; border-radius: 4px; background: #3a3a3a; transition: width 0.5s; }
    .funnel-count { font-size: 11px; font-weight: 700; width: 28px; text-align: right; color: var(--muted2); }
    .funnel-drop { font-size: 10px; color: var(--red); font-weight: 700; white-space: nowrap; }

    /* ── EMAIL CATS ─────────────────────── */
    .email-cats { display: flex; flex-direction: column; gap: 10px; }
    .email-row { display: flex; align-items: center; gap: 10px; }
    .email-name { font-size: 12px; color: var(--muted2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-bar-wrap { flex: 2; background: var(--border); border-radius: 4px; height: 5px; }
    .email-bar { height: 100%; border-radius: 4px; background: var(--blue); }
    .email-count { font-size: 11px; font-weight: 700; width: 22px; text-align: right; color: var(--muted2); }

    /* ── TIME BREAKDOWN ─────────────────── */
    .time-rows { display: flex; flex-direction: column; gap: 12px; }
    .time-row { display: flex; justify-content: space-between; align-items: center; }
    .time-name { font-size: 12px; color: var(--muted2); }
    .time-val { font-size: 14px; font-weight: 700; }

    /* ── NOSHOW ─────────────────────────── */
    .noshow-big {
      font-size: 48px; font-weight: 800; letter-spacing: -2px;
      color: var(--red); margin-bottom: 4px; line-height: 1;
    }
    .noshow-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .noshow-cost {
      font-size: 13px; color: var(--muted2);
      padding-top: 14px; border-top: 1px solid var(--border);
      line-height: 1.6;
    }
    .noshow-cost strong { color: var(--red); }

    /* ── HEALTH SCORE ───────────────────── */
    .health-wrap { display: flex; align-items: center; gap: 20px; }
    .health-ring { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
    .health-ring svg { transform: rotate(-90deg); }
    .health-ring circle { fill: none; stroke-width: 8; }
    .health-ring .track { stroke: var(--border2); }
    .health-ring .fill { stroke-dasharray: 283; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .health-score-num {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px; font-weight: 800;
    }
    .health-info { flex: 1; }
    .health-label { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .health-breakdown { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .health-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted2); }
    .health-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── AI INSIGHTS ────────────────────── */
    .insight-list { display: flex; flex-direction: column; gap: 10px; }
    .insight-item {
      padding: 14px 16px; border-radius: 10px;
      background: var(--bg2); border: 1px solid var(--border);
      font-size: 13px; line-height: 1.5;
    }
    .insight-item.high { border-left: 3px solid var(--red); }
    .insight-item.medium { border-left: 3px solid var(--amber); }
    .insight-item.low { border-left: 3px solid var(--green); }
    .insight-title { font-weight: 700; margin-bottom: 3px; font-size: 12px; }
    .insight-desc { font-size: 12px; color: var(--muted2); }

    /* ── INVOICE ────────────────────────── */
    .invoice-grid { display: flex; gap: 0; margin-top: 4px; }
    .invoice-stat { flex: 1; text-align: center; padding: 12px; border-right: 1px solid var(--border); }
    .invoice-stat:last-child { border-right: none; }
    .invoice-num { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
    .invoice-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── SOCIAL ─────────────────────────── */
    .social-rows { display: flex; flex-direction: column; gap: 12px; }
    .social-row { display: flex; justify-content: space-between; align-items: center; }
    .social-name { font-size: 13px; color: var(--muted2); display: flex; align-items: center; gap: 6px; }
    .social-val { font-size: 15px; font-weight: 700; }

    /* ── REPORT BTN ─────────────────────── */
    .report-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--text); color: var(--bg); border: none;
      border-radius: 8px; padding: 11px 22px;
      font-size: 13px; font-weight: 700;
      font-family: 'Inter', sans-serif; cursor: pointer; text-decoration: none;
      transition: opacity 0.15s;
    }
    .report-btn:hover { opacity: 0.85; }

    /* ── SETUP PENDING ──────────────────── */
    .setup-pending {
      max-width: 440px; margin: 100px auto;
      text-align: center; padding: 0 20px;
    }
    .setup-icon { font-size: 48px; margin-bottom: 20px; }
    .setup-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
    .setup-sub { font-size: 14px; color: var(--muted2); line-height: 1.6; }

    /* ── ANALYZING (welcome wait) ───────── */
    .analyzing-wrap {
      max-width: 500px; margin: 80px auto; padding: 0 20px;
    }
    .analyzing-header { margin-bottom: 36px; }
    .analyzing-header h2 { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
    .analyzing-header p { font-size: 14px; color: var(--muted2); line-height: 1.6; }
    .analyzing-steps-list { display: flex; flex-direction: column; gap: 0; }
    .a-step { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .a-step:last-child { border-bottom: none; }
    .a-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--border2); flex-shrink: 0; margin-top: 3px;
      transition: all 0.3s;
    }
    .a-dot.active { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 10px rgba(59,130,246,0.4); animation: pulse 1.5s infinite; }
    .a-dot.done { border-color: var(--green); background: var(--green); }
    .a-dot.waiting { border-color: var(--border2); }
    .a-step-text { font-size: 14px; color: var(--muted); transition: color 0.3s; }
    .a-step-text.active { color: var(--text); font-weight: 600; }

    /* ── WELCOME ANALYSIS ───────────────── */
    .analysis-section { max-width: 900px; }

    .audit-plan-cards {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; margin-bottom: 14px;
    }
    @media(max-width:700px) { .audit-plan-cards { grid-template-columns: 1fr; } }

    .plan-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px;
    }
    .plan-day {
      font-size: 10px; font-weight: 700; color: var(--muted2);
      letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px;
    }
    .plan-focus { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .plan-why { font-size: 12px; color: var(--muted2); margin-bottom: 10px; line-height: 1.5; }
    .plan-checks { display: flex; flex-direction: column; gap: 4px; }
    .plan-check { font-size: 11px; color: var(--muted); display: flex; gap: 6px; }
    .plan-check::before { content: '→'; color: var(--purple); flex-shrink: 0; }

    /* ── SEP ────────────────────────────── */
    .sep { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── SECTION LABEL ──────────────────── */
    .section-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.7px; text-transform: uppercase;
      margin-bottom: 14px; margin-top: 32px;
    }
    .section-label:first-child { margin-top: 0; }

    /* ── EMPTY STATE ────────────────────── */
    .empty-state { font-size: 13px; color: var(--muted); padding: 20px 0; text-align: center; }

    /* ── CONNECT HINT ───────────────────── */
    .connect-hint {
      margin-top: 14px; font-size: 12px; color: var(--muted);
      background: var(--bg2); border-radius: 8px; padding: 12px 14px;
      border: 1px solid var(--border); line-height: 1.5;
    }

    /* ── SCROLLBAR ──────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar" id="topbar">
  <span class="logo">AI-Granskning</span>
  <div class="topbar-center" id="topbarCenter"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="live-dot"></span>
    <span style="font-size:11px;color:var(--muted)">Live</span>
  </div>
</div>

<div id="root" style="min-height:80vh"></div>

<script>
const token = location.pathname.split('/')[2];
let currentData = null;

async function load() {
  if (!token) {
    document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">🔑</div><div class="setup-title">Åtkomst saknas</div><div class="setup-sub">Öppna länken du fick från din konsult.</div></div>`;
    return;
  }
  try {
    const r = await fetch('/api/dashboard', { headers: { 'x-audit-token': token } });
    if (!r.ok) throw new Error('auth');
    const data = await r.json();
    currentData = data;
    render(data);
  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="setup-pending"><div class="setup-icon">🔒</div><div class="setup-title">Länken är ogiltig</div><div class="setup-sub">Kontakta din konsult för en ny länk.</div></div>`;
  }
}

// Auto-refresh every 30s
setInterval(async () => {
  try {
    const r = await fetch('/api/dashboard', { headers: { 'x-audit-token': token } });
    if (r.ok) { currentData = await r.json(); render(currentData); }
  } catch(e) {}
}, 30000);

function render(data) {
  const { audit, kpis, funnel, dropoffStep, bookingsPerDay, emailCategories, manualTime, healthScore, insights } = data;
  const modules = audit.aiModules || [];

  // Topbar
  document.getElementById('topbarCenter').innerHTML = `
    <span class="company-tag">${audit.companyName}</span>
    <span class="industry-tag">${audit.industry || 'Företag'}</span>
    <span class="day-badge">Dag ${audit.dayNumber} / 7</span>
  `;

  // States
  if (!audit.setupComplete || !modules.length) {
    if (audit.welcomeComplete && audit.aiWelcomeAnalysis) {
      document.getElementById('root').innerHTML = renderWelcomeAnalysis(audit, kpis, healthScore);
    } else if (audit.welcomeComplete) {
      document.getElementById('root').innerHTML = `
        <div class="setup-pending">
          <div class="setup-icon">🔍</div>
          <div class="setup-title">AI:n analyserar er situation</div>
          <div class="setup-sub">Era svar är mottagna. Sidan uppdateras automatiskt när analysen är klar.</div>
        </div>`;
      let polls = 0;
      const pi = setInterval(async () => {
        polls++;
        if (polls > 30) { clearInterval(pi); return; }
        try {
          const r = await fetch('/api/dashboard', { headers: { 'x-audit-token': token } });
          if (!r.ok) return;
          const fresh = await r.json();
          if (fresh.audit?.aiWelcomeAnalysis) { clearInterval(pi); setTimeout(() => location.reload(), 500); }
        } catch(e) {}
      }, 4000);
    } else {
      document.getElementById('root').innerHTML = `
        <div class="setup-pending">
          <div class="setup-icon">⚙️</div>
          <div class="setup-title">Dashboard konfigureras</div>
          <div class="setup-sub">Din personliga AI-dashboard håller på att byggas upp.<br>Den är klar när din konsult har slutfört analyssteget.</div>
        </div>`;
    }
    return;
  }

  // ── FULL DASHBOARD ──
  const dayPct = Math.round((audit.dayNumber / 7) * 100);
  let html = `<div class="container">`;

  // Company header
  const initials = (audit.companyName || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  html += `
    <div class="company-header">
      <div class="company-header-left">
        <div class="company-logo-box">${initials}</div>
        <div class="company-info">
          <div class="company-name-big">${audit.companyName}</div>
          <div class="company-meta">
            <span class="meta-pill">${audit.industry || 'Företag'}</span>
            <span class="meta-pill green">● Aktiv granskning</span>
            <span class="meta-pill">Dag ${audit.dayNumber} av 7</span>
          </div>
        </div>
      </div>
      <div class="company-header-right">
        <div class="audit-status-label" style="font-size:11px;color:var(--muted);margin-bottom:6px">Granskningsframsteg</div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-1px">${dayPct}%</div>
        <div class="audit-progress-bar">
          <div class="audit-progress-fill" style="width:${dayPct}%"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">${audit.daysLeft > 0 ? `${audit.daysLeft} dag${audit.daysLeft !== 1 ? 'ar' : ''} kvar` : 'Klar'}</div>
      </div>
    </div>`;

  // KPI row
  html += renderKpiRow(kpis, modules, bookingsPerDay, manualTime);

  // Main grid: activity chart + health
  html += `<div class="main-grid">`;
  html += renderActivityChart(bookingsPerDay, emailCategories, modules);
  html += renderHealthCard(healthScore, kpis);
  html += `</div>`;

  // Detail grid
  html += `<div class="detail-grid">`;
  if (modules.includes('bookings') || modules.includes('noshow')) html += renderNoShowCard(kpis, bookingsPerDay);
  if (modules.includes('email')) html += renderEmailCard(emailCategories);
  if (modules.includes('funnel')) html += renderFunnelCard(funnel, dropoffStep);

// ══════════════════════════════════
// KPI ROW
// ══════════════════════════════════
function renderKpiRow(kpis, modules, bookingsPerDay, manualTime) {
  const cards = [];

  // Sparkline helper
  function spark(vals, color, fill) {
    if (!vals || vals.length < 2) return '';
    const max = Math.max(...vals, 1);
    const min = Math.min(...vals, 0);
    const range = max - min || 1;
    const w = 100, h = 36;
    const pts = vals.map((v, i) => {
      const x = (i / (vals.length - 1)) * w;
      const y = h - ((v - min) / range) * (h - 4) - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  }

  if (modules.includes('visitors') || modules.includes('funnel')) {
    const v = kpis.visitors || 0;
    const sparkVals = [Math.max(0, v*0.6), v*0.8, v*0.7, v*0.9, v*0.75, v*1.1, v];
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">👥 Besökare</div>
      <div class="kpi-value">${v}</div>
      <div class="kpi-sparkline">${spark(sparkVals, '#3b82f6')}</div>
      <div class="kpi-trend neutral">senaste 7 dagarna</div>
    </div>`);
  }

  if (modules.includes('bookings') || modules.includes('noshow')) {
    const rate = kpis.noShowRate || 0;
    const isHigh = rate > 10;
    const sparkVals = [rate*0.9, rate*1.1, rate*0.8, rate*1.2, rate*1.0, rate*0.95, rate];
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">❌ No-show-rate</div>
      <div class="kpi-value" style="${isHigh ? 'color:var(--red)' : ''}">${rate}<span class="kpi-unit">%</span></div>
      <div class="kpi-sparkline">${spark(sparkVals, isHigh ? '#ef4444' : '#22c55e')}</div>
      <div class="kpi-trend ${isHigh ? 'down' : 'up'}">${isHigh ? '⚠ Hög – åtgärd behövs' : '✓ OK nivå'}</div>
    </div>`);
  }

  if (modules.includes('email')) {
    const em = kpis.unansweredEmails || 0;
    const isHigh = em > 5;
    const sparkVals = [Math.max(0,em-3), em+2, em-1, em+4, em+1, em+3, em];
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">📧 Obesvarade mejl</div>
      <div class="kpi-value" style="${isHigh ? 'color:var(--amber)' : ''}">${em}</div>
      <div class="kpi-sparkline">${spark(sparkVals, isHigh ? '#f59e0b' : '#3b82f6')}</div>
      <div class="kpi-trend ${isHigh ? 'down' : 'neutral'}">${isHigh ? 'Kräver svar' : 'Under kontroll'}</div>
    </div>`);
  }

  if (modules.includes('funnel')) {
    const cr = kpis.conversionRate || 0;
    const sparkVals = [cr*0.8, cr*1.1, cr*0.9, cr*1.2, cr*1.0, cr*0.95, cr];
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">🔄 Konvertering</div>
      <div class="kpi-value">${cr}<span class="kpi-unit">%</span></div>
      <div class="kpi-sparkline">${spark(sparkVals, '#22c55e')}</div>
      <div class="kpi-trend neutral">besök → bokning</div>
    </div>`);
  }

  if (modules.includes('manual_time')) {
    const h = manualTime?.total || 0;
    const sparkVals = [h*0.9, h*1.1, h*0.95, h*1.05, h*1.0, h*0.98, h];
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">⏱ Manuell tid</div>
      <div class="kpi-value">${h}<span class="kpi-unit">h/v</span></div>
      <div class="kpi-sparkline">${spark(sparkVals, '#8b5cf6')}</div>
      <div class="kpi-trend down">kan automatiseras</div>
    </div>`);
  }

  if (!cards.length) {
    const hs = healthScore?.score || 0;
    cards.push(`<div class="kpi-card">
      <div class="kpi-label">💚 Hälsostatus</div>
      <div class="kpi-value">${hs}<span class="kpi-unit">/100</span></div>
      <div class="kpi-trend neutral">Totalt betyg</div>
    </div>`);
  }

  return `<div class="kpi-row">${cards.slice(0,4).join('')}</div>`;
}

function renderHealthCard(hs, kpis) {

  return `<div class="card">

    ${f.length ? `<div class="funnel">

        return `<div class="funnel-row">
          <span class="funnel-label" style="${isDropoff ? 'color:var(--red);font-weight:700' : ''}">${s.step}</span>
          <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.round(s.count/maxVal*100)}%;${isDropoff ? 'background:var(--red)' : ''}"></div></div>
          <span class="funnel-count">${s.count}</span>
          ${i>0 && drop>20 ? `<span class="funnel-drop">−${drop}%</span>` : '<span style="width:36px"></span>'}

function startAnalyzingAnimation() {
  const steps = ['as1','as2','as3','as4'];
  const texts = ['at1','at2','at3','at4'];
  let i = 0;
  function next() {
    if (i > 0) {
      const prev = document.getElementById(steps[i-1]);
      if (prev) prev.className = 'a-dot done';
      const prevT = document.getElementById(texts[i-1]);
      if (prevT) prevT.className = 'a-step-text';
    }
    if (i < steps.length) {
      const cur = document.getElementById(steps[i]);
      if (cur) cur.className = 'a-dot active';
      const curT = document.getElementById(texts[i]);
      if (curT) curT.className = 'a-step-text active';
      i++;
      setTimeout(next, i < steps.length ? 2200 : 99999);
    }
  }
  setTimeout(next, 400);
