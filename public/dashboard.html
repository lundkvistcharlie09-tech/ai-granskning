<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Granskning</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f4f5f7;
      --sidebar: #ffffff;
      --card:    #ffffff;
      --border:  #e8eaed;
      --text:    #111318;
      --sub:     #8a8f9e;
      --muted:   #c4c8d4;
      --accent:  #f97316;
      --green:   #10b981;
      --green2:  rgba(16,185,129,.1);
      --red:     #ef4444;
      --red2:    rgba(239,68,68,.08);
      --blue:    #3b82f6;
      --purple:  #8b5cf6;
      --r:       14px;
      --rsm:     10px;
      --shadow:  0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
      --shadow2: 0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.06);
    }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* ── LAYOUT ── */
    .layout { display:flex; min-height:100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width:64px; flex-shrink:0;
      background:var(--sidebar);
      border-right:1px solid var(--border);
      position:fixed; top:0; left:0; height:100vh;
      display:flex; flex-direction:column;
      align-items:center;
      padding:20px 0;
      z-index:40;
    }
    .sb-logo {
      width:36px; height:36px; border-radius:10px;
      background:var(--text);
      display:flex; align-items:center; justify-content:center;
      margin-bottom:28px;
    }
    .sb-logo svg { width:18px; height:18px; color:#fff; }
    .sb-nav { display:flex; flex-direction:column; gap:4px; flex:1; }
    .sb-icon {
      width:40px; height:40px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .15s;
      color:var(--muted);
    }
    .sb-icon:hover { background:var(--bg); color:var(--sub); }
    .sb-icon.active { background:var(--bg); color:var(--text); }
    .sb-icon svg { width:18px; height:18px; }
    .sb-avatar {
      width:34px; height:34px; border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:#fff;
      margin-top:auto;
    }

    /* ── MAIN ── */
    .main { margin-left:64px; flex:1; min-width:0; padding:28px 28px 60px; max-width:1200px; }

    /* ── TOPBAR ── */
    .topbar {
      display:flex; align-items:flex-start; justify-content:space-between;
      margin-bottom:24px; gap:16px;
    }
    .topbar-left h1 { font-size:22px; font-weight:700; letter-spacing:-.4px; margin-bottom:3px; }
    .topbar-left p  { font-size:13px; color:var(--sub); }
    .topbar-right {
      display:flex; align-items:center; gap:10px; flex-shrink:0;
    }
    .search-bar {
      display:flex; align-items:center; gap:8px;
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--rsm); padding:8px 14px;
      font-size:13px; color:var(--sub);
      box-shadow:var(--shadow); min-width:200px;
      cursor:text;
    }
    .search-bar svg { width:14px; height:14px; flex-shrink:0; }
    .topbar-btn {
      width:36px; height:36px; border-radius:var(--rsm);
      background:var(--card); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow:var(--shadow); color:var(--sub);
      transition:background .15s;
    }
    .topbar-btn:hover { background:var(--bg); }
    .topbar-btn svg { width:16px; height:16px; }

    /* ── MASONRY GRID ── */
    .grid {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      grid-auto-rows:auto;
      gap:14px;
    }

    /* ── CARD BASE ── */
    .card {
      background:var(--card);
      border-radius:var(--r);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      padding:20px;
      position:relative;
      overflow:hidden;
    }

    /* ── STAT CARDS (top row) ── */
    .stat-card { }
    .stat-label {
      font-size:11px; font-weight:500; color:var(--sub);
      margin-bottom:10px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .stat-label-icon {
      width:28px; height:28px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .stat-val {
      font-size:24px; font-weight:700; letter-spacing:-.8px;
      line-height:1; margin-bottom:6px;
    }
    .stat-badge {
      display:inline-flex; align-items:center; gap:3px;
      font-size:10.5px; font-weight:600;
      padding:2px 7px; border-radius:5px;
    }
    .stat-badge.pos { color:var(--green); background:var(--green2); }
    .stat-badge.neg { color:var(--red);   background:var(--red2); }

    /* sparkline */
    .sparkline { height:36px; margin:8px 0 2px; }
    .sparkline svg { width:100%; height:100%; overflow:visible; }

    /* ── ACTIVITY CARD (top right, green) ── */
    .activity-card {
      background:linear-gradient(135deg,#064e3b,#065f46);
      border-color:transparent;
      color:#fff;
    }
    .activity-card .stat-label { color:rgba(255,255,255,.6); }
    .activity-card .stat-val   { color:#fff; }

    /* ── BALANCE CARD (wide) ── */
    .balance-card { grid-column:span 2; }
    .balance-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      margin-bottom:16px;
    }
    .balance-title { font-size:12px; font-weight:600; color:var(--sub); margin-bottom:4px; }
    .balance-status {
      font-size:11px; font-weight:500; color:var(--green);
      display:flex; align-items:center; gap:4px;
    }
    .balance-status::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--green); }
    .balance-row {
      display:flex; align-items:baseline; gap:12px; margin-bottom:4px;
    }
    .balance-pct  { font-size:22px; font-weight:700; letter-spacing:-.6px; }
    .balance-amt  { font-size:24px; font-weight:700; letter-spacing:-.8px; }
    .chart-area   { height:80px; position:relative; margin:12px 0 0; }
    .chart-area svg { width:100%; height:100%; overflow:visible; }
    .period-select {
      font-size:11px; font-weight:500; color:var(--sub);
      background:var(--bg); border:1px solid var(--border);
      border-radius:6px; padding:3px 10px; cursor:pointer;
    }

    /* ── EARNINGS CARD ── */
    .earnings-card { }
    .earnings-big { font-size:28px; font-weight:700; letter-spacing:-1px; margin:8px 0 4px; }
    .donut-wrap { position:relative; width:80px; height:80px; margin:12px 0; }
    .donut-wrap svg { transform:rotate(-90deg); }
    .donut-pct {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:16px; font-weight:700;
    }

    /* ── PROFILE CARD ── */
    .profile-card { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .profile-av {
      width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:700; color:#fff; margin-bottom:10px;
    }
    .profile-name { font-size:14px; font-weight:700; margin-bottom:2px; }
    .profile-role { font-size:11px; color:var(--sub); }
    .profile-stats {
      display:flex; gap:0; width:100%; margin-top:14px;
      border-top:1px solid var(--border); padding-top:14px;
    }
    .profile-stat { flex:1; text-align:center; }
    .profile-stat:not(:last-child) { border-right:1px solid var(--border); }
    .profile-stat-val { font-size:16px; font-weight:700; }
    .profile-stat-lbl { font-size:10px; color:var(--sub); margin-top:2px; }

    /* ── CREDIT CARD ── */
    .credit-card { grid-column:span 2; }
    .cc-wrap {
      background:linear-gradient(135deg,#1e293b,#334155);
      border-radius:12px; padding:18px 20px; margin:12px 0 14px;
      position:relative; overflow:hidden; height:110px;
    }
    .cc-wrap::before {
      content:'';
      position:absolute; right:-20px; top:-20px;
      width:120px; height:120px; border-radius:50%;
      background:rgba(255,255,255,.04);
    }
    .cc-wrap::after {
      content:'';
      position:absolute; right:20px; bottom:-30px;
      width:100px; height:100px; border-radius:50%;
      background:rgba(255,255,255,.03);
    }
    .cc-num  { font-size:12px; color:rgba(255,255,255,.5); letter-spacing:.5px; margin-top:6px; }
    .cc-name { font-size:11px; font-weight:600; color:rgba(255,255,255,.8); margin-top:16px; }
    .cc-chip {
      position:absolute; right:20px; bottom:18px;
      width:28px; height:20px; border-radius:4px;
      background:linear-gradient(135deg,#f59e0b,#d97706);
    }
    .cc-logo { font-size:11px; font-weight:700; color:#fff; }
    .cc-cta {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--text); color:#fff;
      border-radius:8px; padding:8px 14px;
      font-size:12px; font-weight:600; cursor:pointer;
      transition:opacity .15s; border:none; font-family:inherit;
    }
    .cc-cta:hover { opacity:.88; }

    /* ── TRANSFERS CARD ── */
    .transfers-card { }
    .transfer-row {
      display:flex; align-items:center; gap:10px;
      padding:8px 0; border-bottom:1px solid var(--border);
    }
    .transfer-row:last-child { border-bottom:none; }
    .transfer-av {
      width:28px; height:28px; border-radius:50%;
      background:var(--bg); display:flex; align-items:center;
      justify-content:center; font-size:10px; font-weight:600;
      color:var(--sub); flex-shrink:0;
    }
    .transfer-name  { font-size:12px; font-weight:500; flex:1; }
    .transfer-date  { font-size:10px; color:var(--sub); }
    .transfer-amt   { font-size:12px; font-weight:600; }
    .transfer-amt.pos { color:var(--green); }
    .transfer-amt.neg { color:var(--red); }

    /* ── SECURITY / MISC ── */
    .security-card {
      background:var(--bg);
      border-style:dashed;
    }
    .sec-title { font-size:12px; font-weight:600; margin-bottom:6px; }
    .sec-sub   { font-size:11px; color:var(--sub); line-height:1.5; margin-bottom:12px; }
    .sec-btn {
      display:inline-flex; align-items:center; gap:5px;
      background:var(--card); border:1px solid var(--border);
      border-radius:7px; padding:7px 12px;
      font-size:11px; font-weight:600; cursor:pointer;
      font-family:inherit; color:var(--text); transition:background .15s;
    }
    .sec-btn:hover { background:var(--border); }

    /* ── CARD HEADER ── */
    .card-head {
      font-size:12px; font-weight:600; color:var(--text);
      margin-bottom:4px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .card-edit {
      width:24px; height:24px; border-radius:6px;
      background:var(--bg); display:flex; align-items:center;
      justify-content:center; cursor:pointer; color:var(--sub);
    }
    .card-edit svg { width:12px; height:12px; }

    /* ── AI CHAT BUBBLE ── */
    .ai-bubble {
      position:fixed; bottom:28px; right:28px; z-index:100;
    }
    .ai-btn {
      width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow:0 4px 20px rgba(102,126,234,.5);
      border:none; transition:transform .2s, box-shadow .2s;
    }
    .ai-btn:hover { transform:scale(1.08); box-shadow:0 6px 28px rgba(102,126,234,.6); }
    .ai-btn svg { width:22px; height:22px; color:#fff; }
    .ai-window {
      position:absolute; bottom:66px; right:0;
      width:320px; background:var(--card);
      border:1px solid var(--border); border-radius:16px;
      box-shadow:var(--shadow2);
      display:none; flex-direction:column;
      overflow:hidden;
    }
    .ai-window.open { display:flex; }
    .ai-window-head {
      padding:14px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px;
    }
    .ai-window-av {
      width:30px; height:30px; border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .ai-window-name { font-size:13px; font-weight:600; }
    .ai-window-status { font-size:11px; color:var(--green); }
    .ai-msgs {
      flex:1; padding:14px 16px; display:flex; flex-direction:column; gap:10px;
      overflow-y:auto; max-height:260px; min-height:100px;
    }
    .msg { max-width:85%; }
    .msg.bot { align-self:flex-start; }
    .msg.user { align-self:flex-end; }
    .msg-bubble {
      padding:9px 12px; border-radius:12px;
      font-size:12.5px; line-height:1.5;
    }
    .msg.bot  .msg-bubble { background:var(--bg); color:var(--text); border-bottom-left-radius:4px; }
    .msg.user .msg-bubble { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-bottom-right-radius:4px; }
    .ai-input-wrap {
      padding:12px 14px; border-top:1px solid var(--border);
      display:flex; gap:8px; align-items:center;
    }
    .ai-input {
      flex:1; border:1px solid var(--border); border-radius:8px;
      padding:8px 12px; font-size:12.5px; font-family:inherit;
      background:var(--bg); color:var(--text); outline:none;
      transition:border-color .15s;
    }
    .ai-input:focus { border-color:var(--blue); }
    .ai-send {
      width:32px; height:32px; border-radius:8px;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; border:none; flex-shrink:0;
      transition:opacity .15s;
    }
    .ai-send:hover { opacity:.88; }
    .ai-send svg { width:14px; height:14px; color:#fff; }

    /* typing dots */
    .typing { display:flex; gap:4px; align-items:center; padding:2px 0; }
    .typing span {
      width:6px; height:6px; border-radius:50%; background:var(--muted);
      animation:tdot 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay:.2s; }
    .typing span:nth-child(3) { animation-delay:.4s; }
    @keyframes tdot { 0%,80%,100%{transform:scale(.8);opacity:.4} 40%{transform:scale(1);opacity:1} }

    /* ── SCROLL ── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:var(--muted); border-radius:4px; }

    /* ── PENDING ── */
    .setup-pending { max-width:360px; margin:100px auto; text-align:center; padding:0 20px; }
    .setup-title { font-size:19px; font-weight:700; margin-bottom:8px; }
    .setup-sub   { font-size:13px; color:var(--sub); line-height:1.6; }

    @media(max-width:900px) {
      .grid { grid-template-columns:1fr 1fr; }
      .balance-card, .credit-card { grid-column:span 2; }
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sb-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="sb-nav">
      <div class="sb-icon active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="sb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <div class="sb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      </div>
      <div class="sb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="sb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <div class="sb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </div>
    </div>
    <div class="sb-avatar" id="sbAvatar">?</div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="greeting">Hej, Företag!</h1>
        <p>Se information och aktivitet om er verksamhet</p>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Sök eller fråga Sage...
        </div>
        <div class="topbar-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </div>
        <div class="topbar-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
      </div>
    </div>

    <!-- GRID -->
    <div class="grid" id="root">
      <!-- fylls av JS -->
    </div>
  </div>

</div>

<!-- AI CHAT BUBBLE -->
<div class="ai-bubble">
  <div class="ai-window" id="aiWindow">
    <div class="ai-window-head">
      <div class="ai-window-av">S</div>
      <div>
        <div class="ai-window-name">Sage – er AI-assistent</div>
        <div class="ai-window-status">Online</div>
      </div>
    </div>
    <div class="ai-msgs" id="aiMsgs">
      <div class="msg bot"><div class="msg-bubble">Hej! Jag är Sage, er AI-assistent. Fråga mig vad som helst om er granskning.</div></div>
    </div>
    <div class="ai-input-wrap">
      <input class="ai-input" id="aiInput" type="text" placeholder="Skriv en fråga..." autocomplete="off">
      <button class="ai-send" id="aiSend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  <button class="ai-btn" id="aiToggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </button>
</div>

<script>
const token = location.pathname.split('/')[2];
let _data = null;

// ── LOAD ──
async function load() {
  if (!token) { showError('Åtkomst saknas','Öppna länken du fick från din konsult.'); return; }
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (!r.ok) throw new Error();
    _data = await r.json();
    render(_data);
  } catch(e) { showError('Ogiltig länk','Kontakta din konsult för en ny länk.'); }
}
function showError(title, sub) {
  document.getElementById('root').innerHTML =
    `<div class="setup-pending" style="grid-column:1/-1"><div class="setup-title">${title}</div><div class="setup-sub">${sub}</div></div>`;
}
setInterval(async () => {
  if (!token) return;
  try {
    const r = await fetch('/api/dashboard', { headers:{'x-audit-token':token} });
    if (r.ok) { _data = await r.json(); render(_data); }
  } catch(e) {}
}, 30000);

// ── SPARKLINE ──
function sparkline(vals, color, fill) {
  const W=100, H=36, pad=4;
  const max=Math.max(...vals), min=Math.min(...vals);
  const range=max-min||1;
  const pts=vals.map((v,i)=>[
    pad+(i/(vals.length-1))*(W-pad*2),
    pad+(1-(v-min)/range)*(H-pad*2)
  ]);
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${fill?`<path d="${area}" fill="url(#sg${color.replace('#','')})"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ── LINE CHART (balance) ──
function lineChart(vals, color) {
  const W=400, H=70, padL=0, padR=0, padT=4, padB=4;
  const iW=W-padL-padR, iH=H-padT-padB;
  const max=Math.max(...vals), min=Math.min(...vals);
  const range=max-min||1;
  const pts=vals.map((v,i)=>[
    padL+(i/(vals.length-1))*iW,
    padT+(1-(v-min)/range)*iH
  ]);
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){
    const cx=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*0.4;
    d+=` C${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)}, ${cx.toFixed(1)} ${pts[i][1].toFixed(1)}, ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
  }
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="bcg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#bcg)"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ── DONUT ──
function donut(pct, color) {
  const r=34, c=2*Math.PI*r, offset=c-(pct/100)*c;
  return `<svg width="80" height="80" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#f1f3f5" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 40 40)"/>
  </svg>`;
}

// ── AI CHAT ──
const aiWindow = document.getElementById('aiWindow');
const aiToggle = document.getElementById('aiToggle');
const aiMsgs   = document.getElementById('aiMsgs');
const aiInput  = document.getElementById('aiInput');
const aiSend   = document.getElementById('aiSend');

aiToggle.addEventListener('click', () => aiWindow.classList.toggle('open'));

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="msg-bubble">${text}</div>`;
  aiMsgs.appendChild(div);
  aiMsgs.scrollTop = aiMsgs.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  aiMsgs.appendChild(div);
  aiMsgs.scrollTop = aiMsgs.scrollHeight;
  return div;
}

const SAGE_RESPONSES = {
  'no-show': 'Baserat på er granskning har ni en no-show-rate på ca {noshow}%. Det kostar er uppskattningsvis {cost} kr per vecka. Automatiska SMS-påminnelser kan minska detta 60–80%.',
  'kostnad': 'Den identifierade kostnaden för ineffektivitet är {cost} kr/vecka. Det inkluderar no-shows, manuell tid och obesvarade mejl.',
  'rapport': 'Er slutrapport genereras automatiskt dag 7. Den innehåller en fullständig analys och konkreta AI-rekommendationer.',
  'dag': 'Ni är på dag {day} av 7 i er granskning. {left} dagar kvar tills rapporten är klar.',
  'default': 'Det är en bra fråga! Baserat på er granskning rekommenderar jag att ni fokuserar på att automatisera de mest tidskrävande processerna först.'
};

async function sendMessage() {
  const text = aiInput.value.trim();
  if (!text) return;
  aiInput.value = '';
  addMsg(text, 'user');
  const typing = showTyping();

  await new Promise(r => setTimeout(r, 900 + Math.random()*600));
  typing.remove();

  const d = _data?.audit || {};
  const kpis = _data?.kpis || {};
  const cost = Math.round((d.dayNumber||1) * 450 * (kpis.noShowRate||8)/10);

  const tl = text.toLowerCase();
  let reply = SAGE_RESPONSES.default;
  if (tl.includes('no-show') || tl.includes('uteblir') || tl.includes('bokning'))
    reply = SAGE_RESPONSES['no-show'];
  else if (tl.includes('kostnad') || tl.includes('kostar') || tl.includes('pengar'))
    reply = SAGE_RESPONSES['kostnad'];
  else if (tl.includes('rapport') || tl.includes('resultat'))
    reply = SAGE_RESPONSES['rapport'];
  else if (tl.includes('dag') || tl.includes('kvar') || tl.includes('länge'))
    reply = SAGE_RESPONSES['dag'];

  reply = reply
    .replace('{noshow}', kpis.noShowRate || 8)
    .replace('{cost}', cost.toLocaleString('sv-SE'))
    .replace('{day}', d.dayNumber || 1)
    .replace('{left}', d.daysLeft || 6);

  addMsg(reply, 'bot');
}

aiSend.addEventListener('click', sendMessage);
aiInput.addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });

load();
